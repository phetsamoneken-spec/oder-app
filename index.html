    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // Google Sheet ID ທີ່ກຳນົດ
      const TARGET_SHEET_ID = '12CV_NOtFAsj9xZ6LnzzEqi5PjbPPVegOpFOC9B8m7gY';
      const GOOGLE_SHEET_URL = `https://docs.google.com/spreadsheets/d/${TARGET_SHEET_ID}/edit`;
      const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbyQZms_ORK3pN_bHs_ijwG2xfdRKsCDE979IMcMG2j0xjllxa_VljBK-oVL-JI_LeiH/exec';

      // ປ່ຽນ Base64 Data URL ເປັນ File Object ສຳລັບສົ່ງເຂົ້າ WhatsApp ໂດຍກົງ
      function dataURLtoFile(dataurl, filename) {
        try {
          const arr = dataurl.split(',');
          const mime = arr[0].match(/:(.*?);/)[1];
          const bstr = atob(arr[1]);
          let n = bstr.length;
          const u8arr = new Uint8Array(n);
          while (n--) {
            u8arr[n] = bstr.charCodeAt(n);
          }
          return new File([u8arr], filename, { type: mime });
        } catch (e) {
          return null;
        }
      }

      // Helper function ສຳລັບເຊື່ອມຕໍ່ Apps Script ໂດຍກົງ (ເມື່ອ Run ຢູ່ Google Script)
      // ຫຼື fetch POST ຖ້າ run ຈາກພາຍນອກ
      async function syncOrderToGoogleSheet(order, customScriptUrl) {
        // 1. ຖ້າ Run ຢູ່ພາຍໃນ Google Apps Script Web App (HtmlService)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => resolve({ success: true, result: res }))
              .withFailureHandler((err) => resolve({ success: false, error: err }))
              .saveOrderFromClient(order);
          });
        }

        // 2. ຖ້າ Run ແບບ Standalone ຫຼື ຜ່ານ External Browser URL
        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) {
          return { success: false, reason: 'NO_SCRIPT_URL' };
        }

        try {
          await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'saveOrder',
              sheetId: TARGET_SHEET_ID,
              order: order,
            }),
          });
          return { success: true };
        } catch (err) {
          console.warn('Google Sheet Sync Error:', err);
          return { success: false, error: err };
        }
      }

      async function updateStatusOnGoogleSheet(orderId, status, customScriptUrl, updates = {}) {
        const collector = updates.collectorName || '';
        const statusWithCollector = collector ? `${status} (${collector})` : status;
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => resolve({ success: true, result: res }))
              .withFailureHandler((err) => resolve({ success: false, error: err }))
              .updateOrderStatusFromClient(orderId, statusWithCollector);
          });
        }

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) return { success: false };

        try {
          await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'update_status',
              sheetId: TARGET_SHEET_ID,
              orderId: orderId,
              status: statusWithCollector,
              collector: collector,
            }),
          });
          return { success: true };
        } catch (err) {
          return { success: false };
        }
      }

      // Helper function ສຳລັບອັບໂຫຼດຮູບພາບເຂົ້າ Google Drive ໂຟນເດີ "order app" (ID: 1JFlPMCT6FyANB_3XN7wFhaGIQK7NEU2x)
      async function uploadImageToGoogleDrive(base64Data, filename = 'image', type = 'menu', customScriptUrl) {
        if (!base64Data || typeof base64Data !== 'string') return null;
        if (base64Data.startsWith('http://') || base64Data.startsWith('https://')) {
          let fileId = '';
          const match = base64Data.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (match) fileId = match[1];
          return {
            status: 'success',
            directUrl: base64Data,
            fileId: fileId,
            viewUrl: fileId ? `https://drive.google.com/file/d/${fileId}/view` : base64Data
          };
        }
        if (!base64Data.startsWith('data:image')) {
          return null;
        }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => resolve(res))
              .withFailureHandler(() => resolve(null))
              .handleImageUpload({
                fileData: base64Data,
                fileName: filename,
                type: type,
              });
          });
        }

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) return null;

        try {
          const res = await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'upload_image',
              fileData: base64Data,
              fileName: filename,
              type: type,
              sheetId: TARGET_SHEET_ID,
            }),
          });
          const text = await res.text();
          let data = null;
          try {
            data = JSON.parse(text);
          } catch (e) {
            console.warn('Google Drive Image Upload parse response:', text);
          }
          if (data && (data.status === 'success' || data.directUrl)) {
            return data;
          }
        } catch (err) {
          console.warn('Google Drive Image Upload Error:', err);
        }
        return null;
      }

      // Helper function ສຳລັບບັນທຶກ ຫຼື ອັບເດດເມນູສິນຄ້າ 1 ລາຍການລົງ Google Sheet
      async function saveSingleProductToGoogleSheet(product, customScriptUrl) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => resolve({ success: true, result: res }))
              .withFailureHandler((err) => resolve({ success: false, error: err }))
              .saveSingleProductFromClient(product);
          });
        }

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) return { success: false, reason: 'NO_SCRIPT_URL' };

        try {
          const res = await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'save_single_product',
              sheetId: TARGET_SHEET_ID,
              product: product,
            }),
          });
          const text = await res.text();
          try {
            const data = JSON.parse(text);
            return { success: true, data };
          } catch (e) {
            return { success: true };
          }
        } catch (err) {
          console.warn('saveSingleProductToGoogleSheet error:', err);
          return { success: false, error: err };
        }
      }

      // Helper function ສຳລັບບັນທຶກ ຫຼື ອັບເດດພະນັກງານ 1 ທ່ານລົງ Google Sheet
      async function saveSingleCashierToGoogleSheet(cashier, customScriptUrl) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => resolve({ success: true, result: res }))
              .withFailureHandler((err) => resolve({ success: false, error: err }))
              .saveSingleCashierFromClient(cashier);
          });
        }

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) return { success: false, reason: 'NO_SCRIPT_URL' };

        try {
          const res = await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'save_single_cashier',

          const text = await res.text();
          try {
            const data = JSON.parse(text);
            return { success: true, data };
          } catch (e) {
            return { success: true };
          }
        } catch (err) {
          console.warn('saveSingleCashierToGoogleSheet error:', err);
          return { success: false, error: err };
        }
      }

      // Helper function ສຳລັບບັນທຶກ ແລະ ອັບເດດລາຍຊື່ພະນັກງານເກັບເງິນລົງ Google Sheet ແທັບ Cashiers
      async function syncCashiersToGoogleSheet(cashiersList, customScriptUrl) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => resolve({ success: true, result: res }))

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;

        } catch (err) {

      // Helper function ສຳລັບບັນທຶກ ແລະ ອັບເດດລາຍການເມນູລົງ Google Sheet ແທັບ Menu

        if (typeof google !== 'undefined' && google.script && google.script.run) {

            google.script.run
              .withSuccessHandler((res) => resolve({ success: true, result: res }))

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) {

        }

        try {
          const res = await fetch(scriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },

              action: 'save_products',

          });
          const text = await res.text();
          try {

      }

      // Helper function ສຳລັບດຶງເມນູຫຼ້າສຸດຈາກ Google Sheet
      async function fetchProductsFromGoogleSheet(customScriptUrl) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.status === 'success' && Array.isArray(res.products)) {
                  resolve(res.products);
                } else {
                  resolve(null);
                }
              })
              .withFailureHandler(() => resolve(null))
              .getMenuFromSheet();
          });
        }

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) return null;

        try {
          const res = await fetch(`${scriptUrl}?action=get_menu`);
          const data = await res.json();
          if (data && data.status === 'success' && Array.isArray(data.products) && data.products.length > 0) {
            return data.products;
          }
        } catch (err) {
          console.warn('Google Sheet Fetch Menu Error:', err);
        }
        return null;
      }

      // Helper function ສຳລັບດຶງລາຍຊື່ພະນັກງານ ແລະ ຮູບພາບຫຼ້າສຸດຈາກ Google Sheet
      async function fetchCashiersFromGoogleSheet(customScriptUrl) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.status === 'success' && Array.isArray(res.cashiers)) {
                  resolve(res.cashiers);
                } else {

                }
              })
              .withFailureHandler(() => resolve(null))
              .getCashiersFromSheet();
          });
        }

        const scriptUrl = customScriptUrl || localStorage.getItem('lao_pos_gas_url') || DEFAULT_GAS_URL;
        if (!scriptUrl) return null;

        try {
          const res = await fetch(`${scriptUrl}?action=get_cashiers`);
          const data = await res.json();
          if (data && data.status === 'success' && Array.isArray(data.cashiers) && data.cashiers.length > 0) {
            return data.cashiers;

        } catch (err) {

        }
        return null;
      }

      let synth = null;
      async function unlockAudio() {
        try {
          if (window.Tone && Tone.context.state !== 'running') {
            await Tone.start();
          }
        } catch (e) {}
      }

      function playFeedbackSound(type = 'click') {
        try {
          if (!synth && window.Tone) {
            synth = new Tone.PolySynth(Tone.Synth, {
              oscillator: { type: 'sine' },
              envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 },
            }).toDestination();
            synth.volume.value = -12;
          }
          if (synth && window.Tone && Tone.context.state === 'running') {
            if (type === 'click') {
              synth.triggerAttackRelease('C5', '0.04');
            } else if (type === 'success') {
              synth.triggerAttackRelease(['E5', 'G5', 'C6'], '0.12');
            } else if (type === 'delete') {
              synth.triggerAttackRelease('A3', '0.08');
            }
          }
        } catch (e) {}
      }

      function compressImage(file, maxWidth = 640, quality = 0.75) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                resolve(e.target.result);
                return;
              }
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function checkGeoPermission() {
        if (!navigator.permissions || !navigator.geolocation) {
          return 'unsupported';
        }
        try {
          const res = await navigator.permissions.query({ name: 'geolocation' });
          return res.state;
        } catch (e) {
          return 'prompt';
        }
      }

      function getDeviceLocation(onProgress) {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            fetch('https://get.geojs.io/v1/ip/geo.json')
              .then((res) => res.json())
              .then((data) => {
                resolve({
                  lat: Number(parseFloat(data.latitude).toFixed(6)),
                  lng: Number(parseFloat(data.longitude).toFixed(6)),
                  accuracy: 500,
                  source: 'Network IP',
                });
              })
              .catch(() => reject(new Error('GEOLOCATION_NOT_SUPPORTED')));
            return;
          }

          let bestPos = null;
          let watchId = null;
          let timeoutHandle = null;

          const finish = (pos) => {
            if (watchId !== null) {
              navigator.geolocation.clearWatch(watchId);
              watchId = null;
            }
            if (timeoutHandle !== null) {
              clearTimeout(timeoutHandle);
              timeoutHandle = null;
            }
            if (pos) {
              resolve({
                lat: Number(pos.coords.latitude.toFixed(6)),
                lng: Number(pos.coords.longitude.toFixed(6)),
                accuracy: Math.round(pos.coords.accuracy || 10),
                altitude: pos.coords.altitude ? Math.round(pos.coords.altitude) : null,
                source: pos.coords.accuracy <= 25 ? 'GPS ດາວທຽມ (High Precision)' : 'Wi-Fi/Cellular',
              });
            } else {
              navigator.geolocation.getCurrentPosition(
                (p) =>
                  resolve({
                    lat: Number(p.coords.latitude.toFixed(6)),
                    lng: Number(p.coords.longitude.toFixed(6)),
                    accuracy: Math.round(p.coords.accuracy || 50),
                    source: 'Standard GPS',
                  }),
                async (err) => {
                  try {
                    const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
                    const data = await res.json();
                    resolve({
                      lat: Number(parseFloat(data.latitude).toFixed(6)),
                      lng: Number(parseFloat(data.longitude).toFixed(6)),
                      accuracy: 500,
                      source: 'Network IP',
                    });
                  } catch (e) {
                    reject(err);
                  }
                },
                { enableHighAccuracy: false, timeout: 6000 }
              );
            }
          };

          timeoutHandle = setTimeout(() => {
            finish(bestPos);
          }, 12000);

          try {
            watchId = navigator.geolocation.watchPosition(
              (pos) => {
                const acc = Math.round(pos.coords.accuracy || 999);
                if (onProgress) {
                  onProgress({
                    lat: Number(pos.coords.latitude.toFixed(6)),
                    lng: Number(pos.coords.longitude.toFixed(6)),
                    accuracy: acc,
                  });
                }
                if (!bestPos || pos.coords.accuracy < bestPos.coords.accuracy) {
                  bestPos = pos;
                }
                if (acc <= 15) {
                  finish(bestPos);
                }
              },
              (err) => {
                if (!bestPos && err.code === err.PERMISSION_DENIED) {
                  clearTimeout(timeoutHandle);
                  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                  reject(err);
                }
              },
              { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
          } catch (e) {
            finish(null);
          }
        });
      }

      function buildWhatsAppSlip(cartItems, subtotal, discount, total, notes, profile, orderId, cashGiven = 0, change = 0) {
        const currentId = orderId || `ORD-${Math.floor(100000 + Math.random() * 900000)}`;
        const dateStr = formatDateTimeLao(new Date().toISOString());
        const lines = [
          `🧾 *ໃບສັ່ງຊື້ / ORDER SUMMARY*`,
          `🏪 *ຮ້ານ:* ${profile.name}`,
          `👤 *ລູກຄ້າ:* ${profile.customerName || profile.ownerName || 'ລູກຄ້າທົ່ວໄປ'}`,
          `📱 *ເບີໂທ:* ${profile.customerPhone || profile.phone || '-'}`,
          `🔢 *ລະຫັດບິນ:* ${currentId}`,
          `⏰ *ເວລາ:* ${dateStr}`,
        ];

        if (profile.lat && profile.lng) {
          const accText = profile.gpsAccuracy ? ` (ຄວາມແມ່ນຍຳ ±${profile.gpsAccuracy}m)` : '';
          const tag = profile.isLiveGps ? '🔴 *ຕຳແໜ່ງ GPS ສົດ (Real-time Live Location)*' : '📍 *Location (ແຜນທີ່ຮ້ານ)*';
          lines.push(`${tag}: https://www.google.com/maps?q=${Number(profile.lat).toFixed(6)},${Number(profile.lng).toFixed(6)}${accText}`);
        }

        if (profile.photoUrl) {
          lines.push(`📸 *ຮູບພາບໜ້າຮ້ານ:* (ແນບພ້ອມຂໍ້ຄວາມ)`);
        }

        lines.push(`---------------------------`);
        lines.push(`📋 *ລາຍການອາຫານ & ເຄື່ອງດື່ມ:*`);
        cartItems.forEach((item, index) => {
          const itemTotal = item.product.price * item.quantity;
          lines.push(`${index + 1}. ${item.product.name} × ${item.quantity} = ${formatKip(itemTotal)} ກີບ`);
        });

        lines.push(`---------------------------`);
        lines.push(`💰 *ຍອດລວມ:* ${formatKip(subtotal)} ກີບ`);
        if (discount > 0) {
          lines.push(`🏷️ *ສ່ວນຫຼຸດ:* -${formatKip(discount)} ກີບ`);
        }
        lines.push(`💵 *ຍອດສຸດທິ:* *${formatKip(total)} ກີບ*`);

        if (cashGiven > 0) {
          lines.push(`📥 *ຮັບເງິນສົດ:* ${formatKip(cashGiven)} ກີບ`);
          lines.push(`🔄 *ເງິນທອນ:* ${formatKip(change)} ກີບ`);

        if (notes && notes.trim()) {
          lines.push(`📝 *ໝາຍເຫດ:* ${notes.trim()}`);
        }

        lines.push(`🙏 *ຂອບໃຈທີ່ໃຊ້ບໍລິການ!*`);
        return lines.join('\n');

      function exportOrdersToCSV(orders) {
        if (!orders || orders.length === 0) return;
        const headers = ['Order ID', 'Date', 'Customer Name', 'Phone', 'Items', 'Total (LAK)', 'Status', 'Dispatch Mode', 'Sheet ID'];
        const rows = orders.map((o) => [
          o.id,
          o.createdAt,
          `"${(o.customerName || '').replace(/"/g, '""')}"`,
          `"${(o.customerPhone || o.phone || '').replace(/"/g, '""')}"`,
          `"${(o.items || []).map((i) => `${i.productName}x${i.quantity}`).join('; ').replace(/"/g, '""')}"`,
          o.total,
          o.status || 'pending',
          o.dispatchMode || 'group',
          TARGET_SHEET_ID,
        ]);
        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `orders_sheet_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

                <div className="bg-[#faf8ff] p-3 rounded-2xl border border-gray-100 flex flex-col gap-2 text-[12px] text-[#3c4a42]">
                  <div className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-[#006c49] text-white font-bold text-[11px] flex items-center justify-center shrink-0 mt-0.5">1</span>
                    <p className="leading-snug">ກົດໄອຄອນ <strong>🔒 ແມ່ກະແຈ</strong> ຫຼື <strong>⚙️ ຕັ້ງຄ່າ</strong> ຢູ່ແຖບ URL ດ້ານເທິງ.</p>
                  </div>
                  <div className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-[#006c49] text-white font-bold text-[11px] flex items-center justify-center shrink-0 mt-0.5">2</span>
                    <p className="leading-snug">ເລືອກ <strong>"ການອະນຸຍາດ (Permissions)"</strong> ຫຼື <strong>"Site settings"</strong>.</p>
                  </div>
                  <div className="flex items-start gap-2">
                    <span className="w-5 h-5 rounded-full bg-[#006c49] text-white font-bold text-[11px] flex items-center justify-center shrink-0 mt-0.5">3</span>
                    <p className="leading-snug">ຊອກຫາ <strong>"ສະຖານທີ່ (Location)"</strong> ແລ້ວເລືອກ <strong>"ອະນຸຍາດ (Allow)"</strong>.</p>
                  </div>
                </div>
              </div>

              <button
                type="button"
                onClick={onClose}
                className="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition-colors"
              >
                ເຂົ້າໃຈແລ້ວ, ປິດໜ້າຕ່າງ
              </button>
            </div>
          </div>
        );
      };

      const LeafletMap = ({ lat, lng, accuracy = 15, onPositionChange, height = '220px', onOpenPermissionModal }) => {
        const mapContainerRef = useRef(null);
        const mapInstanceRef = useRef(null);
        const markerRef = useRef(null);
        const accuracyCircleRef = useRef(null);
        const currentLayersRef = useRef([]);
        const liveWatchIdRef = useRef(null);

        const [mapType, setMapType] = useState('street');
        const [isLiveMode, setIsLiveMode] = useState(false);
        const [autoFollow, setAutoFollow] = useState(true);
        const [liveAccuracy, setLiveAccuracy] = useState(accuracy);
        const [liveSpeed, setLiveSpeed] = useState(null);
        const [lastUpdateTime, setLastUpdateTime] = useState(null);
        const [isLocatingQuick, setIsLocatingQuick] = useState(false);

        const applyTileLayers = (map, type) => {
          currentLayersRef.current.forEach((layer) => map.removeLayer(layer));
          currentLayersRef.current = [];
          if (type === 'satellite') {
            const satLayer = L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19, attribution: '&copy; Esri' }
            ).addTo(map);
            const labelLayer = L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19 }
            ).addTo(map);
            currentLayersRef.current = [satLayer, labelLayer];
          } else {
            const streetLayer = L.tileLayer(
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
              { maxZoom: 19, attribution: '&copy; Esri' }
            ).addTo(map);
            currentLayersRef.current = [streetLayer];
          }
        };

        const updateAccuracyCircle = (map, targetLat, targetLng, targetAcc, isLive) => {
          if (accuracyCircleRef.current) {
            map.removeLayer(accuracyCircleRef.current);
          }
          if (targetAcc && targetAcc > 0 && targetAcc <= 800) {
            accuracyCircleRef.current = L.circle([targetLat, targetLng], {
              radius: targetAcc,
              color: isLive ? '#10b981' : '#006c49',
              weight: isLive ? 2 : 1.5,
              opacity: 0.85,
              fillColor: isLive ? '#10b981' : '#006c49',
              fillOpacity: isLive ? 0.2 : 0.12,
            }).addTo(map);
          }
        };

        const getMarkerIcon = (isLive) => {
          if (isLive) {
            return L.divIcon({
              className: 'custom-live-radar-pin',
              html: `
                <div style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
                  <div class="live-radar-ping" style="position: absolute; width: 44px; height: 44px; border-radius: 9999px; background: rgba(16, 185, 129, 0.45); border: 1.5px solid #10b981;"></div>
                  <div style="position: relative; width: 22px; height: 22px; border-radius: 9999px; background: #006c49; border: 3px solid #ffffff; box-shadow: 0 0 12px rgba(16,185,129,0.8), 0 3px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;">
                    <div style="width: 8px; height: 8px; border-radius: 9999px; background: #ffffff;"></div>
                  </div>
                </div>
              `,
              iconSize: [44, 44],
              iconAnchor: [22, 22],
            });
          }
          return L.divIcon({
            className: 'custom-leaflet-pin',
            html: `
              <div style="position: relative; width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));">
                <svg width="36" height="44" viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M18 0C8.05887 0 0 8.05887 0 18C0 28.5 15.5 42.5 17.1 43.8C17.6 44.2 18.4 44.2 18.9 43.8C20.5 42.5 36 28.5 36 18C36 8.05887 27.9411 0 18 0Z" fill="#006c49" stroke="#ffffff" stroke-width="1.5"/>
                  <circle cx="18" cy="17" r="7" fill="white"/>
                  <circle cx="18" cy="17" r="4.5" fill="#10b981"/>
                </svg>
              </div>
            `,
            iconSize: [36, 44],
            iconAnchor: [18, 44],
          });
        };

        const handleQuickLocate = async () => {
          vibrateSoft(25);
          setIsLocatingQuick(true);
          try {
            const loc = await getDeviceLocation((progress) => {
              if (progress.accuracy) setLiveAccuracy(progress.accuracy);
            });
            setLiveAccuracy(loc.accuracy);
            onPositionChange(loc.lat, loc.lng, loc.accuracy, false);
            if (mapInstanceRef.current) {
              mapInstanceRef.current.flyTo([loc.lat, loc.lng], 17, { duration: 1.2 });
              updateAccuracyCircle(mapInstanceRef.current, loc.lat, loc.lng, loc.accuracy, false);
            }
          } catch (err) {
            if (err && err.code === 1 && onOpenPermissionModal) {
              onOpenPermissionModal();
            }
          } finally {
            setIsLocatingQuick(false);
          }
        };

        const toggleLiveTracking = () => {
          vibrateSoft(25);
          if (isLiveMode) {
            if (liveWatchIdRef.current !== null && navigator.geolocation) {
              navigator.geolocation.clearWatch(liveWatchIdRef.current);
              liveWatchIdRef.current = null;
            }
            setIsLiveMode(false);
            onPositionChange(lat, lng, liveAccuracy, false);
            if (markerRef.current) {
              markerRef.current.setIcon(getMarkerIcon(false));
              markerRef.current.dragging?.enable();
            }
            if (mapInstanceRef.current) {
              updateAccuracyCircle(mapInstanceRef.current, lat, lng, liveAccuracy, false);
            }
          } else {
            if (!navigator.geolocation) {
              if (onOpenPermissionModal) onOpenPermissionModal();
              return;
            }
            setIsLiveMode(true);
            if (markerRef.current) {
              markerRef.current.setIcon(getMarkerIcon(true));
              markerRef.current.dragging?.disable();
            }

            liveWatchIdRef.current = navigator.geolocation.watchPosition(
              (pos) => {
                const newLat = Number(pos.coords.latitude.toFixed(6));
                const newLng = Number(pos.coords.longitude.toFixed(6));
                const acc = Math.round(pos.coords.accuracy || 10);
                const speedKmh = pos.coords.speed !== null && pos.coords.speed > 0
                  ? Math.round(pos.coords.speed * 3.6)
                  : 0;

                setLiveAccuracy(acc);
                setLiveSpeed(speedKmh);
                setLastUpdateTime(new Date().toLocaleTimeString('lo-LA', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));

                onPositionChange(newLat, newLng, acc, true);

                if (markerRef.current) {
                  markerRef.current.setLatLng([newLat, newLng]);
                }
                if (mapInstanceRef.current) {
                  updateAccuracyCircle(mapInstanceRef.current, newLat, newLng, acc, true);
                  if (autoFollow) {
                    mapInstanceRef.current.panTo([newLat, newLng], { animate: true, duration: 0.5 });
                  }
                }
              },
              (err) => {
                if (err && err.code === 1 && onOpenPermissionModal) {
                  setIsLiveMode(false);
                  onOpenPermissionModal();
                }
              },
              { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
            );
          }
        };

        useEffect(() => {
          if (!mapContainerRef.current) return;
          if (!mapInstanceRef.current) {
            const map = L.map(mapContainerRef.current, {
              center: [lat, lng],
              zoom: 16,
              zoomControl: false,
              attributionControl: false,
            });
            applyTileLayers(map, mapType);

            const marker = L.marker([lat, lng], { draggable: !isLiveMode, icon: getMarkerIcon(isLiveMode) }).addTo(map);

            marker.on('dragend', () => {
              if (isLiveMode) return;
              const pos = marker.getLatLng();
              onPositionChange(Number(pos.lat.toFixed(6)), Number(pos.lng.toFixed(6)), 10, false);
              updateAccuracyCircle(map, pos.lat, pos.lng, 10, false);
            });

            map.on('click', (e) => {
              if (isLiveMode) return;
              marker.setLatLng(e.latlng);
              onPositionChange(Number(e.latlng.lat.toFixed(6)), Number(e.latlng.lng.toFixed(6)), 10, false);
              updateAccuracyCircle(map, e.latlng.lat, e.latlng.lng, 10, false);
            });

            mapInstanceRef.current = map;
            markerRef.current = marker;
            updateAccuracyCircle(map, lat, lng, liveAccuracy, isLiveMode);
            setTimeout(() => map.invalidateSize(), 200);
          } else {
            if (!isLiveMode) {
              mapInstanceRef.current.flyTo([lat, lng], Math.max(mapInstanceRef.current.getZoom(), 16), { duration: 0.8 });
              if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
              updateAccuracyCircle(mapInstanceRef.current, lat, lng, liveAccuracy, false);
            }
          }
        }, [lat, lng]);

        useEffect(() => {
          if (mapInstanceRef.current) applyTileLayers(mapInstanceRef.current, mapType);
        }, [mapType]);

        useEffect(() => {
          return () => {
            if (liveWatchIdRef.current !== null && navigator.geolocation) {
              navigator.geolocation.clearWatch(liveWatchIdRef.current);
              liveWatchIdRef.current = null;
            }
          };
        }, []);

        return (
          <div className="relative w-full rounded-2xl overflow-hidden border border-emerald-900/15 shadow-sm">
            <div ref={mapContainerRef} style={{ height }} className="w-full bg-[#1b232a]" />

            <div className="absolute top-2 left-2 z-[30] flex flex-col gap-1 pointer-events-none">
              <div className="bg-black/85 backdrop-blur-md text-white text-[11px] font-display font-medium px-2.5 py-1 rounded-full shadow-md flex items-center gap-1.5 border border-white/20">
                {isLiveMode ? (
                  <span className="flex items-center gap-1 text-[#4edea3] font-bold">
                    <span className="w-2 h-2 rounded-full bg-[#10b981] animate-ping inline-block"></span>
                    <span>LIVE ສົດ</span>
                  </span>
                ) : (
                  <span className="w-2 h-2 rounded-full bg-[#10b981]"></span>
                )}
                <span>{Number(lat).toFixed(5)}, {Number(lng).toFixed(5)}</span>
                {liveAccuracy && (
                  <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                    liveAccuracy <= 20 ? 'bg-emerald-600 text-white' : 'bg-amber-600 text-white'
                  }`}>
                    ±{liveAccuracy}m
                  </span>
                )}
              </div>

              {isLiveMode && (
                <div className="bg-emerald-950/90 text-emerald-200 text-[10px] px-2 py-0.5 rounded-lg border border-emerald-500/40 font-display flex items-center gap-2">
                  <span>ຄວາມໄວ: <strong>{liveSpeed || 0} km/h</strong></span>
                  {lastUpdateTime && <span>• {lastUpdateTime}</span>}
                </div>
              )}
            </div>

            <div className="absolute top-2 right-2 z-[30] bg-white/95 backdrop-blur-md p-0.5 rounded-xl shadow-md border border-black/10 flex items-center">
              <button
                type="button"
                onClick={() => setMapType('street')}
                className={`px-2 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 transition-all ${
                  mapType === 'street' ? 'bg-[#006c49] text-white shadow-xs' : 'text-gray-600 hover:text-gray-900'
                }`}
              >
                <span className="material-symbols-outlined text-[14px]">map</span>
                <span>ແຜນທີ່</span>
              </button>
              <button
                type="button"
                onClick={() => setMapType('satellite')}
                className={`px-2 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1 transition-all ${
                  mapType === 'satellite' ? 'bg-[#006c49] text-white shadow-xs' : 'text-gray-600 hover:text-gray-900'
                }`}
              >
                <span className="material-symbols-outlined text-[14px]">satellite_alt</span>
                <span>ດາວທຽມ</span>
              </button>
            </div>

            <div className="absolute bottom-2 inset-x-2 z-[30] flex items-center justify-between gap-1.5 pointer-events-auto">
              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={toggleLiveTracking}
                  className={`px-3 py-1.5 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-md active:scale-95 transition-all border ${
                    isLiveMode
                      ? 'bg-gradient-to-r from-red-600 to-rose-600 text-white border-white/40 ring-2 ring-red-400/50 animate-pulse'
                      : 'bg-white/95 hover:bg-emerald-50 text-[#006c49] border-emerald-900/15'
                  }`}
                >
                  <span className="material-symbols-outlined text-[17px]">
                    {isLiveMode ? 'sensors' : 'location_searching'}
                  </span>
                  <span>{isLiveMode ? 'ຢຸດ Live' : '🔴 ເປີດ GPS ສົດ'}</span>
                </button>

                {!isLiveMode && (
                  <button
                    type="button"
                    onClick={handleQuickLocate}
                    disabled={isLocatingQuick}
                    className="bg-white/95 hover:bg-emerald-50 text-[#006c49] text-[11px] font-bold px-2.5 py-1.5 rounded-xl shadow-md border border-emerald-900/15 flex items-center gap-1 active:scale-95 transition-all"
                  >
                    <span className={`material-symbols-outlined text-[15px] ${isLocatingQuick ? 'animate-spin' : ''}`}>
                      {isLocatingQuick ? 'sync' : 'my_location'}
                    </span>
                    <span>{isLocatingQuick ? 'ລັອກ...' : 'GPS ຂ້ອຍ'}</span>
                  </button>
                )}
              </div>

              {isLiveMode && (
                <button
                  type="button"
                  onClick={() => {
                    vibrateSoft(10);
                    setAutoFollow(!autoFollow);
                    if (!autoFollow && mapInstanceRef.current) {
                      mapInstanceRef.current.panTo([lat, lng]);
                    }
                  }}
                  className={`px-2.5 py-1.5 rounded-xl text-[11px] font-bold shadow-md active:scale-95 transition-all flex items-center gap-1 border ${
                    autoFollow ? 'bg-[#006c49] text-white border-emerald-500' : 'bg-white/95 text-gray-700 border-gray-200'
                  }`}
                >
                  <span className="material-symbols-outlined text-[15px]">{autoFollow ? 'gps_fixed' : 'gps_not_fixed'}</span>
                  <span>{autoFollow ? 'Follow: ເປີດ' : 'Follow: ປິດ'}</span>
                </button>
              )}
            </div>
          </div>
        );
      };


      const GpsModal = ({ isOpen, onClose, currentLat, currentLng, onUpdateLocation, onShowToast, onOpenPermissionModal, permState }) => {
        const [loading, setLoading] = useState(false);
        const [liveAccuracy, setLiveAccuracy] = useState(null);
        const [manualLat, setManualLat] = useState(currentLat || 18.0293);
        const [manualLng, setManualLng] = useState(currentLng || 102.6322);

        useEffect(() => {
          setManualLat(currentLat);
          setManualLng(currentLng);
        }, [currentLat, currentLng, isOpen]);

        if (!isOpen) return null;

        const LAO_PRESETS = [
          { name: 'ບຸມຈອມແຈ້ງ (ວຽງຈັນ)', lat: 18.0293, lng: 102.6322 },
          { name: 'ປະຕູໄຊ ວຽງຈັນ', lat: 17.9757, lng: 102.6331 },
          { name: 'ຕະຫຼາດເຊົ້າ ວຽງຈັນ', lat: 17.9642, lng: 102.6143 },
          { name: 'ມ.ຊ ດົງໂດກ', lat: 18.0416, lng: 102.6319 },
          { name: 'ຫຼວງພະບາງ', lat: 19.8894, lng: 102.1352 },
          { name: 'ປາກເຊ', lat: 15.1202, lng: 105.7823 },
          { name: 'ສະຫວັນນະເຂດ', lat: 16.5562, lng: 104.7521 },
        ];

        const handleRequestGps = async () => {
          vibrateSoft(30);
          setLoading(true);
          setLiveAccuracy(null);
          try {
            const loc = await getDeviceLocation((progress) => {
              if (progress.accuracy) {
                setLiveAccuracy(progress.accuracy);
                setManualLat(progress.lat);
                setManualLng(progress.lng);
              }
            });
            onUpdateLocation(loc.lat, loc.lng, loc.accuracy);
            onShowToast(`ລັອກ GPS ສຳເລັດ! ຄວາມແມ່ນຍຳ: ±${loc.accuracy} ແມັດ (${loc.source})`, 'success');
            onClose();
          } catch (err) {
            if (err && err.code === 1) {
              onShowToast('ກະລຸນາອະນຸຍາດສິດ GPS ໃນບຣາວເຊີ', 'warning');
              if (onOpenPermissionModal) onOpenPermissionModal();
            } else {
              onShowToast('ກະລຸນາເປີດສິດ Location/GPS ຫຼື ເລືອກຈຸດແນະນຳດ້ານລຸ່ມ', 'warning');
            }
          } finally {
            setLoading(false);
          }
        };

        const handleSaveManual = (e) => {
          e.preventDefault();
          const lat = Number(parseFloat(manualLat).toFixed(6));
          const lng = Number(parseFloat(manualLng).toFixed(6));
          if (isNaN(lat) || isNaN(lng)) {
            onShowToast('ກະລຸນາໃສ່ພິກັດຕົວເລກທີ່ຖືກຕ້ອງ', 'warning');
            return;
          }
          onUpdateLocation(lat, lng, 10);
          onShowToast(`ບັນທຶກພິກັດ: ${lat}, ${lng}`, 'success');
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-emerald-900/10 flex flex-col gap-4 max-h-[90vh] overflow-y-auto no-scrollbar">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-2xl bg-[#ecfdf5] flex items-center justify-center text-[#006c49]">
                    <span className="material-symbols-outlined text-[24px]">satellite_alt</span>
                  </div>
                  <div>
                    <h3 className="font-display font-bold text-base text-[#006c49] leading-tight">ດຶງຕຳແໜ່ງ GPS ແມ່ນຍຳສູງ</h3>
                    <p className="text-[11px] text-[#3c4a42]">ຈັບສັນຍານດາວທຽມລະດັບແມັດ (High Precision)</p>
                  </div>
                </div>
                <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-gray-100 text-gray-400 flex items-center justify-center">
                  <span className="material-symbols-outlined text-[18px]">close</span>
                </button>
              </div>

              <div className="bg-[#faf8ff] p-3 rounded-2xl border border-[#dae2fd]/60 flex flex-col gap-2 text-xs text-[#3c4a42]">
                <div className="flex justify-between items-center">
                  <span className="font-medium text-[#131b2e]">ພິກັດປັດຈຸບັນ:</span>
                  <span className="font-display font-bold text-[#006c49] bg-[#ecfdf5] px-2 py-0.5 rounded-md">
                    {Number(currentLat).toFixed(5)}, {Number(currentLng).toFixed(5)}
                  </span>
                </div>
                {liveAccuracy && (
                  <div className="flex justify-between items-center pt-1 border-t border-gray-100">
                    <span className="font-medium text-[#131b2e]">ຄວາມແມ່ນຍຳທີ່ຈັບໄດ້:</span>
                    <span className={`font-display font-bold px-2 py-0.5 rounded-md ${
                      liveAccuracy <= 20 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                    }`}>
                      ±{liveAccuracy} ແມັດ
                    </span>
                  </div>
                )}
                <div className="flex justify-between items-center pt-1 border-t border-gray-100 text-[11px]">
                  <span>ສິດອະນຸຍາດ GPS:</span>
                  <button
                    type="button"
                    onClick={() => { if (onOpenPermissionModal) onOpenPermissionModal(); }}
                    className="font-bold underline flex items-center gap-1 text-[#006c49]"
                  >
                    <span>{permState === 'granted' ? 'ອະນຸຍາດແລ້ວ ✓' : permState === 'denied' ? 'ຖືກບລັອກ (ແກ້ໄຂ)' : 'ກວດສອບສິດ'}</span>
                    <span className="material-symbols-outlined text-[13px]">open_in_new</span>
                  </button>
                </div>
              </div>

              <button
                type="button"
                onClick={handleRequestGps}
                disabled={loading}
                className="w-full py-3.5 px-4 bg-[#006c49] hover:bg-[#005236] text-white rounded-xl font-bold flex items-center justify-center gap-2 shadow-md active:scale-95 transition-all disabled:opacity-75 text-[13px]"
              >
                {loading ? (
                  <>
                    <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>

          }

        const handleUploadQrFile = async (e) => {

            const compressed = await compressImage(file, 600, 0.9);

            ownerName: ownerName.trim(),

            logoUrl,
            logoIcon,

                          >
                            <span className="material-symbols-outlined text-[18px]">{item.icon}</span>
                            <span className="truncate">{item.label}</span>
                          </button>

                      </div>
                    </div>

                      <span className="text-[10px] text-gray-500 block truncate">

                      </span>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      vibrateSoft(15);
                      if (onOpenCashierManagement) onOpenCashierManagement();

                    className="px-3 py-1.5 bg-[#006c49] hover:bg-[#005236] text-white font-bold text-xs rounded-xl shadow-xs active:scale-95 transition-all flex items-center gap-1 shrink-0"
                  >
                    <span className="material-symbols-outlined text-[14px]">edit</span>
                    <span>ຈັດການ</span>
                  </button>
                </div>

                <div>
                  <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ເບີໂທຕິດຕໍ່ຮ້ານ</label>
                  <input
                    type="tel"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}

                    className="w-full px-3.5 py-2.5 bg-[#faf8ff] rounded-xl border border-gray-200 text-[13px] font-display text-[#131b2e] focus:outline-none focus:ring-2 focus:ring-[#10b981]"
                  />
                </div>

                <div>
                  <label className="text-[12px] font-bold text-[#3c4a42] block mb-1">ເລກບັນຊີ BCEL One (ສຳລັບສ້າງ QR ມາດຕະຖານ)</label>
                  <input
                    type="text"
                    value={bcelQrAccount}
                    onChange={(e) => setBcelQrAccount(e.target.value)}

                    <span className="flex items-center gap-1">
                      <span className="material-symbols-outlined text-[17px]">qr_code_2</span>
                      <span>ຮູບ QR Code ຮັບເງິນຂອງຂ້ອຍ</span>
                    </span>
                    {customQrImage && (
                      <button
                        type="button"
                        onClick={() => setCustomQrImage(null)}

                      <div className="w-14 h-14 rounded-xl bg-white border border-dashed border-red-300 flex items-center justify-center text-red-400 shrink-0">

                      </div>
                    )}

                      type="button"
                      onClick={() => qrInputRef.current?.click()}

                      <span className="material-symbols-outlined text-[16px]">upload</span>
                      <span>{customQrImage ? 'ປ່ຽນຮູບ QR' : 'ອັບໂຫຼດຮູບ QR ຮັບເງິນ'}</span>
                    </button>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={onClose} className="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-[13px]">

                  </button>
                  <button type="submit" className="flex-1 py-2.5 bg-[#006c49] hover:bg-[#005236] text-white font-bold rounded-xl text-[13px] shadow-sm active:scale-95 flex items-center justify-center gap-1.5">
                    <span className="material-symbols-outlined text-[18px]">check</span>
                    <span>ບັນທຶກ</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      const Header = ({ activeTab, profile, onOpenGpsModal, onQuickSync, onEditStore, onOpenGoogleSheetModal }) => {
        const getTabSubtitle = () => {
          switch (activeTab) {
            case 'pos-menu': return 'ລາຍການສັ່ງຊື້';
            case 'cart-and-whatsapp': return 'ກະຕ່າ & ສົ່ງ WhatsApp';

        return (
          <header className="fixed top-0 inset-x-0 z-50 bg-[#faf8ff]/90 backdrop-blur-xl shadow-[0_1px_12px_rgba(0,108,73,0.06)] border-b border-emerald-900/10">
            <div className="h-16 max-w-lg mx-auto px-4 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5 min-w-0 flex-1">
                <button onClick={onEditStore} className="relative group shrink-0 active:scale-95 transition-transform" title="ຕັ້ງຄ່າຮ້ານ">
                  {profile.logoUrl ? (
                    <img src={profile.logoUrl} alt={profile.name} className="w-10 h-10 rounded-xl object-cover shadow-sm border border-emerald-900/10 bg-white" />
                  ) : (
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#fbb315] to-[#f59e0b] flex items-center justify-center text-white shrink-0 shadow-sm shadow-amber-900/20">
                      <span className="material-symbols-outlined text-[24px]">sports_bar</span>
                    </div>
                  )}
                  <span className="absolute -bottom-1 -right-1 w-4 h-4 bg-white rounded-full shadow-xs flex items-center justify-center text-[#006c49] border border-emerald-100">
                    <span className="material-symbols-outlined text-[10px]">edit</span>
                  </span>
                </button>
                <div className="flex flex-col min-w-0">
                  <button onClick={onEditStore} className="flex items-center gap-1 group text-left max-w-full">
                    <span className="font-display font-bold text-[16px] text-[#006c49] truncate leading-tight tracking-tight group-hover:underline">

                    <span className="material-symbols-outlined text-[13px] text-[#006c49]/70 group-hover:text-[#006c49] shrink-0">edit</span>
                  </button>
                  <button onClick={onOpenGpsModal} className="flex items-center gap-1 mt-0.5 text-left group transition-opacity active:opacity-75">
                    <span className="w-2 h-2 rounded-full bg-[#10b981] animate-pulse shrink-0"></span>
                    <span className="text-[11px] text-[#3c4a42] flex items-center gap-0.5 truncate font-medium">
                      <span className="material-symbols-outlined text-[12px] text-[#006c49]">location_on</span>
                      GPS: {Number(profile.lat).toFixed(3)}, {Number(profile.lng).toFixed(3)} • <span className="text-[#006c49] font-bold">{getTabSubtitle()}</span>
                    </span>
                  </button>
                </div>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={onOpenGoogleSheetModal}
                  className="h-9 px-2.5 rounded-xl flex items-center gap-1 text-[11px] font-bold bg-[#ecfdf5] hover:bg-emerald-100 text-[#0f9d58] border border-[#a7f3d0] transition-colors active:scale-95"

                  <span className="w-2 h-2 rounded-full bg-[#0f9d58] animate-pulse"></span>
                  <span>Sheet ID</span>
                </button>

                          >

                                />
                                <button
                                  type="button"
                                  onClick={() => { vibrateSoft(20); onUpdateQty(product.id, 1); }}
                                  className="w-7 h-7 rounded-lg bg-[#006c49] text-white flex items-center justify-center font-bold shadow-xs active:scale-90"

                </div>
              )}
            </section>

            {cartTotalCount > 0 && (
              <aside className="fixed bottom-20 inset-x-0 z-40 px-3 pointer-events-none">
                <div className="pointer-events-auto mx-auto max-w-lg bg-[#1e293b]/95 backdrop-blur-xl text-white rounded-2xl p-3 shadow-xl flex items-center justify-between gap-2 border border-white/10 animate-slideUp">
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="relative w-10 h-10 rounded-xl bg-[#006c49] flex items-center justify-center text-white shrink-0">
                      <span className="material-symbols-outlined text-[22px]">shopping_cart</span>
                      <span className="absolute -top-1.5 -right-1.5 bg-[#f43f5e] text-white font-display text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center">
                        {cartTotalCount > 99 ? '99+' : cartTotalCount}
                      </span>
                    </div>
                    <div className="flex flex-col min-w-0">
                      <div className="flex items-center gap-1.5 text-xs text-white/80">
                        <span>{cartTotalCount} ລາຍການ</span>
                        <span className="w-1 h-1 rounded-full bg-[#10b981]"></span>
                        <span className="text-[#4edea3] font-semibold">ຍອດລວມ</span>
                      </div>
                      <div className="flex items-baseline gap-1 mt-0.5">
                        <span className="font-display text-[20px] text-[#4edea3] font-black leading-none">
                          {formatKip(cartTotalKip)}
                        </span>
                        <span className="text-[11px] text-white/75">ກີບ</span>
                      </div>
                    </div>
                  </div>
                  <button
                    onClick={() => { vibrateSoft(); onGoToCart(); }}
                    className="h-10 px-4 bg-[#10b981] hover:bg-[#0ea271] text-white font-display font-bold text-[14px] rounded-xl flex items-center gap-1.5 shrink-0 shadow-md active:scale-95 transition-all"
                  >
                    <span>ເບິ່ງກະຕ່າ</span>
                    <span className="material-symbols-outlined text-[17px]">arrow_forward</span>
                  </button>

              </aside>
            )}
          </div>
        );
      };


      const CartTab = ({
        products,
        cart,
        onUpdateQty,
        onSetQty,
        onClearCart,
        profile,
        onUpdateProfile,
        onOrderCompleted,
        onShowToast,
        onGoToMenu,
        onOpenPermissionModal,
      }) => {
        const [discount, setDiscount] = useState(0);
        const [orderNotes, setOrderNotes] = useState('');
        const [cashGiven, setCashGiven] = useState('');
        const [isLocating, setIsLocating] = useState(false);
        const [gpsProgressAcc, setGpsProgressAcc] = useState(null);
        const [directPhone, setDirectPhone] = useState(profile.phone || '02055551234');
        const [isCompressingPhoto, setIsCompressingPhoto] = useState(false);
        const [showClearConfirm, setShowClearConfirm] = useState(false);
        const [showQrModal, setShowQrModal] = useState(false);
        const [activePrintOrder, setActivePrintOrder] = useState(null);

        const cameraInputRef = useRef(null);
        const galleryInputRef = useRef(null);

        const cartItems = useMemo(() => {
          const list = [];
          for (const [productId, qty] of Object.entries(cart)) {
            if (qty > 0) {
              const prod = products.find((p) => p.id === productId);
              if (prod) list.push({ product: prod, quantity: qty });
            }
          }
          return list;
        }, [cart, products]);

        const subtotal = useMemo(() => {
          return cartItems.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
        }, [cartItems]);

        const netTotal = Math.max(0, subtotal - discount);
        const numCashGiven = parseInt(cashGiven, 10) || 0;
        const changeAmount = numCashGiven >= netTotal ? numCashGiven - netTotal : 0;

        const handleDetectGps = async () => {
          vibrateSoft(30);
          setIsLocating(true);
          setGpsProgressAcc(null);
          try {
            const loc = await getDeviceLocation((progress) => {
              if (progress.accuracy) setGpsProgressAcc(progress.accuracy);
            });
            onUpdateProfile({ lat: loc.lat, lng: loc.lng, gpsAccuracy: loc.accuracy });
            onShowToast(`ລັອກ GPS ສຳເລັດ! ຄວາມແມ່ນຍຳ: ±${loc.accuracy} ແມັດ (${loc.source})`, 'success');
          } catch (err) {
            if (err && err.code === 1 && onOpenPermissionModal) {
              onOpenPermissionModal();
            } else {
              onShowToast('ບໍ່ສາມາດດຶງ GPS ໄດ້ ກະລຸນາເປີດສິດ Location ຫຼື ເລືອກຈາກແຜນທີ່', 'warning');
            }
          } finally {
            setIsLocating(false);
            setGpsProgressAcc(null);
          }
        };

        const handlePhotoUpload = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            setIsCompressingPhoto(true);
            const compressed = await compressImage(file, 960, 0.82);
            onUpdateProfile({ photoUrl: compressed });
            onShowToast('ບັນທຶກຮູບໜ້າຮ້ານແລ້ວ! ພ້ອມສົ່ງເຂົ້າ WhatsApp ກັບໃບບິນ 📸', 'success');
          } catch (err) {
            onShowToast('ເກີດຂໍ້ຜິດພາດໃນການອັບໂຫຼດຮູບ', 'error');
          } finally {
            setIsCompressingPhoto(false);
          }
        };

        const createOrderObject = (orderId) => ({
          id: orderId || `ORD-${Math.floor(100000 + Math.random() * 900000)}`,
          createdAt: new Date().toISOString(),
          status: 'pending',
          items: cartItems.map((item) => ({
            productId: item.product.id,
            productName: item.product.name,
            productNameEn: item.product.nameEn,
            category: item.product.category,
            quantity: item.quantity,
            unitPrice: item.product.price,
          })),
          subtotal,
          discount,
          total: netTotal,
          cashGiven: numCashGiven,
          change: changeAmount,
          storeName: profile.name,
          customerName: profile.customerName || profile.ownerName || 'ລູກຄ້າທົ່ວໄປ',
          customerPhone: profile.customerPhone || directPhone || profile.phone,
          ownerName: profile.ownerName || profile.cashierName,
          cashierName: profile.cashierName,
          contactPhone: directPhone,
          phone: directPhone,
          notes: orderNotes,
          location: { lat: profile.lat, lng: profile.lng },
          storePhoto: profile.photoUrl || undefined,
          dispatchMode: profile.whatsappMode,
        });

        const handleSendWhatsApp = async () => {
          vibrateSoft(50);
          if (cartItems.length === 0) {
            onShowToast('ກະຕ່າຫວ່າງເປົ່າ!', 'warning');
            return;
          }
          const orderId = `ORD-${Math.floor(100000 + Math.random() * 900000)}`;
          const textSlip = buildWhatsAppSlip(
            cartItems,
            subtotal,
            discount,
            netTotal,
            orderNotes,
            profile,
            orderId,
            numCashGiven,
            changeAmount
          );

          const newOrder = createOrderObject(orderId);
          onOrderCompleted(newOrder);

          try {
            confetti({ particleCount: 70, spread: 60, origin: { y: 0.8 } });
            playFeedbackSound('success');
          } catch (e) {}

          // 1. ຖ້າມີຮູບໜ້າຮ້ານ ແລະ Browser ຮອງຮັບ Web Share API (ສົ່ງທັງຮູບ + ຂໍ້ຄວາມບິນເຂົ້າ WhatsApp)
          if (profile.photoUrl && navigator.canShare) {
            try {
              const photoFile = dataURLtoFile(profile.photoUrl, `Store_${orderId}.jpg`);
              if (photoFile && navigator.canShare({ files: [photoFile] })) {
                await navigator.share({
                  title: `ໃບສັ່ງຊື້ ${orderId}`,
                  text: textSlip,
                  files: [photoFile],
                });
                onShowToast('ສົ່ງໃບບິນ ແລະ ຮູບພາບໜ້າຮ້ານສຳເລັດ!', 'success');
                return;
              }
            } catch (shareErr) {
              // ຖ້າຜູ້ໃຊ້ກົດ Cancel Share ໃຫ້ຂ້າມໄປ
              if (shareErr.name === 'AbortError') return;
            }
          }

          // 2. Fallback: ເປີດ WhatsApp URL ໂດຍກົງ
          const encoded = encodeURIComponent(textSlip);
          let targetUrl = '';
          if (profile.whatsappMode === 'group') {
            targetUrl = `https://api.whatsapp.com/send?text=${encoded}`;
          } else {
            let cleanPhone = (directPhone || '').replace(/[\s\-\(\)\+]/g, '');
            if (cleanPhone.startsWith('020')) {
              cleanPhone = '85620' + cleanPhone.slice(3);
            } else if (cleanPhone.startsWith('20')) {
              cleanPhone = '856' + cleanPhone;
            }
            targetUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encoded}`;
          }
          window.open(targetUrl, '_blank');
          onShowToast('ເປີດ WhatsApp & ບັນທຶກລົງ Google Sheet...', 'success');
        };

        const handleCopySlip = async () => {
          vibrateSoft(30);
          if (cartItems.length === 0) {
            onShowToast('ກະຕ່າຫວ່າງເປົ່າ!', 'warning');
            return;
          }
          const textSlip = buildWhatsAppSlip(
            cartItems,
            subtotal,
            discount,
            netTotal,
            orderNotes,
            profile,
            null,
            numCashGiven,
            changeAmount
          );
          try {
            const textArea = document.createElement('textarea');
            textArea.value = textSlip;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');

      };


      const DashboardTab = ({ orders, products }) => {
        const [timeRange, setTimeRange] = useState('all');
        const [activeBarIndex, setActiveBarIndex] = useState(null);

        const filteredOrders = useMemo(() => {
          if (timeRange === 'all') return orders;
          const now = new Date();
          const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
          const sevenDaysAgo = startOfToday - 6 * 24 * 3600 * 1000;
          const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

          return orders.filter((o) => {
            const time = new Date(o.createdAt).getTime();
            if (timeRange === 'today') return time >= startOfToday;
            if (timeRange === 'week') return time >= sevenDaysAgo;
            if (timeRange === 'month') return time >= startOfMonth;
            return true;
          });
        }, [orders, timeRange]);

        const stats = useMemo(() => {
          const totalSales = filteredOrders.reduce((sum, o) => sum + (o.total || 0), 0);
          const totalOrders = filteredOrders.length;
          const deliveredOrders = filteredOrders.filter((o) => o.status === 'delivered').length;
          const pendingOrders = filteredOrders.filter((o) => (o.status || 'pending') === 'pending').length;
          const avgOrder = totalOrders > 0 ? Math.round(totalSales / totalOrders) : 0;
          const deliveryRate = totalOrders > 0 ? Math.round((deliveredOrders / totalOrders) * 100) : 0;

          let totalItemsSold = 0;
          let totalCashReceived = 0;
          let totalChangeReturned = 0;

          const itemStats = {};
          const catSales = {
            drinks: { name: 'ເຄື່ອງດື່ມ', icon: 'local_cafe', count: 0, revenue: 0, color: '#006c49' },
            food: { name: 'ອາຫານ', icon: 'restaurant', count: 0, revenue: 0, color: '#f59e0b' },
            desserts: { name: 'ຂອງຫວານ', icon: 'bakery_dining', count: 0, revenue: 0, color: '#ec4899' },
          };

          let groupCount = 0;
          let directCount = 0;

          filteredOrders.forEach((o) => {
            if (o.dispatchMode === 'direct') directCount++;
            else groupCount++;

            totalCashReceived += o.cashGiven || 0;
            totalChangeReturned += o.change || 0;

            (o.items || []).forEach((it) => {
              totalItemsSold += it.quantity;
              const catKey = it.category || 'drinks';
              if (catSales[catKey]) {
                catSales[catKey].count += it.quantity;
                catSales[catKey].revenue += (it.unitPrice || 0) * it.quantity;
              }

              if (!itemStats[it.productName]) {
                const prod = products.find((p) => p.name === it.productName || p.id === it.productId);
                itemStats[it.productName] = {
                  name: it.productName,
                  nameEn: it.productNameEn || '',
                  category: it.category || 'drinks',
                  quantity: 0,
                  revenue: 0,
                  image: prod?.image || 'https://placehold.co/100x100/ecfdf5/006c49?text=' + encodeURIComponent(it.productName.slice(0, 2)),
                };
              }
              itemStats[it.productName].quantity += it.quantity;
              itemStats[it.productName].revenue += (it.unitPrice || 0) * it.quantity;
            });
          });

          const topItems = Object.values(itemStats)
            .sort((a, b) => b.quantity - a.quantity || b.revenue - a.revenue)
            .slice(0, 5);

          const now = new Date();
          const last7Days = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
            const dateStr = d.toISOString().slice(0, 10);
            const dayNamesLao = ['ອາທິດ', 'ຈັນ', 'ອັງຄານ', 'ພຸດ', 'ພະຫັດ', 'ສຸກ', 'ເສົາ'];
            const dayLabel = dayNamesLao[d.getDay()];
            const shortDate = `${d.getDate()}/${d.getMonth() + 1}`;

            const dayTotal = orders
              .filter((o) => new Date(o.createdAt).toISOString().slice(0, 10) === dateStr)
              .reduce((sum, o) => sum + (o.total || 0), 0);

            last7Days.push({ dateStr, dayLabel, shortDate, total: dayTotal });
          }

          const maxDaySales = Math.max(...last7Days.map((d) => d.total), 1);

          return {
            totalSales,
            totalOrders,
            deliveredOrders,
            pendingOrders,
            avgOrder,
            deliveryRate,
            totalItemsSold,
            totalCashReceived,
            totalChangeReturned,
            catSales,
            topItems,
            last7Days,
            maxDaySales,
            dispatchStats: { groupCount, directCount },
          };
        }, [filteredOrders, orders, products]);

        return (
          <div className="flex flex-col w-full pb-36 max-w-lg mx-auto px-4 pt-2 animate-fadeIn">
            {/* Header & Sheet Quick Link */}
            <div className="flex items-center justify-between mb-3">
              <div>

                <p className="text-[12px] text-[#3c4a42]">ຂໍ້ມູນບັນທຶກລົງ Google Sheet: {TARGET_SHEET_ID.slice(0, 10)}...</p>

              <a

                target="_blank"
                rel="noopener noreferrer"
                className="flex items-center gap-1.5 bg-[#0f9d58] hover:bg-[#0c8046] text-white px-3 py-1.5 rounded-xl text-xs font-bold active:scale-95 transition-all shadow-xs"
              >
                <span className="material-symbols-outlined text-[16px]">table_chart</span>
                <span>ເປີດ Sheet ↗</span>
              </a>
            </div>

            <div className="flex items-center gap-1.5 mb-3 bg-white p-1 rounded-2xl border border-gray-100 shadow-2xs">
              {[
                { id: 'all', label: 'ທັງໝົດ' },
                { id: 'today', label: 'ມື້ນີ້' },
                { id: 'week', label: '7 ມື້ຜ່ານມາ' },
                { id: 'month', label: 'ເດືອນນີ້' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  type="button"
                  onClick={() => {
                    vibrateSoft(10);
                    setTimeRange(tab.id);
                  }}
                  className={`flex-1 py-1.5 rounded-xl text-[12px] font-bold transition-all text-center ${
                    timeRange === tab.id
                      ? 'bg-[#006c49] text-white shadow-xs'
                      : 'text-[#3c4a42] hover:text-[#006c49]'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* 4 Main Executive Bento Cards */}
            <div className="grid grid-cols-2 gap-2.5 mb-4">
              <div className="bg-gradient-to-br from-white via-white to-[#ecfdf5] p-3.5 rounded-2xl border border-emerald-900/10 shadow-xs flex flex-col justify-between">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold text-gray-500">ຍອດຂາຍລວມ</span>
                  <div className="w-7 h-7 rounded-xl bg-[#ecfdf5] text-[#006c49] flex items-center justify-center">
                    <span className="material-symbols-outlined text-[16px]">payments</span>
                  </div>
                </div>
                <div className="my-1.5">
                  <span className="font-display font-black text-[20px] text-[#006c49] block leading-tight">
                    {formatKip(stats.totalSales)}
                  </span>
                  <span className="text-[10px] text-gray-400 font-bold">ກີບ (LAK)</span>
                </div>
                <div className="flex items-center gap-1 text-[10px] text-emerald-700 font-bold">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#10b981]"></span>
                  <span>{stats.deliveredOrders} ບິນສົ່ງແລ້ວ</span>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-emerald-900/10 shadow-xs flex flex-col justify-between">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold text-gray-500">ອໍເດີທັງໝົດ</span>
                  <div className="w-7 h-7 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                    <span className="material-symbols-outlined text-[16px]">receipt_long</span>
                  </div>
                </div>
                <div className="my-1.5 flex items-baseline gap-1.5">
                  <span className="font-display font-black text-[22px] text-[#131b2e] leading-tight">
                    {stats.totalOrders}
                  </span>
                  <span className="text-[11px] text-gray-400 font-semibold">ບິນ</span>
                </div>
                <div className="flex items-center justify-between text-[10px]">
                  <span className="text-gray-500 font-semibold">ສົ່ງສຳເລັດ:</span>
                  <span className="font-display font-bold text-[#006c49] bg-[#ecfdf5] px-1.5 py-0.5 rounded-md">
                    {stats.deliveryRate}%
                  </span>
                </div>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-emerald-900/10 shadow-xs flex flex-col justify-between">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold text-gray-500">ຍອດສະເລ່ຍ / ບິນ</span>
                  <div className="w-7 h-7 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                    <span className="material-symbols-outlined text-[16px]">trending_up</span>
                  </div>
                </div>
                <div className="my-1.5">
                  <span className="font-display font-black text-[18px] text-[#131b2e] block leading-tight">
                    {formatKip(stats.avgOrder)}
                  </span>
                  <span className="text-[10px] text-gray-400 font-bold">ກີບ / ບິນ</span>
                </div>
                <span className="text-[10px] text-gray-400 truncate">
                  ຄິດໄລ່ຈາກ {stats.totalOrders} ອໍເດີ
                </span>
              </div>

              <div className="bg-white p-3.5 rounded-2xl border border-emerald-900/10 shadow-xs flex flex-col justify-between">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold text-gray-500">ຈຳນວນທີ່ຂາຍໄດ້</span>
                  <div className="w-7 h-7 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center">
