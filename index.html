                <div className="my-1.5 flex items-baseline gap-1.5">
                  <span className="font-display font-black text-[22px] text-[#131b2e] leading-tight">
                    {stats.totalItemsSold}
                  </span>
                  <span className="text-[11px] text-gray-400 font-semibold">ຈານ/ຈອກ</span>
                </div>
                <span className="text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded-md font-bold w-fit">
                  {stats.pendingOrders} ບິນລໍຖ້າສົ່ງ
                </span>
              </div>
            </div>

            {/* Interactive 7-Day Trend Chart */}
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-3 mb-4">
              <div className="flex items-center justify-between">
                <h3 className="font-display font-bold text-[15px] text-[#131b2e] flex items-center gap-1.5">
                  <span className="material-symbols-outlined text-[18px] text-[#006c49]">bar_chart</span>
                  <span>ຍອດຂາຍ 7 ມື້ຜ່ານມາ</span>
                </h3>
                <span className="text-[11px] text-gray-400 font-semibold">ກົດແທ່ງເພື່ອເບິ່ງຍອດ</span>
              </div>

              <div className="h-44 pt-6 pb-1 flex items-end justify-between gap-2 border-b border-gray-100 relative">
                {stats.last7Days.map((d, index) => {
                  const heightPercent = stats.maxDaySales > 0 ? Math.max(8, Math.round((d.total / stats.maxDaySales) * 100)) : 8;
                  const isHovered = activeBarIndex === index;
                  const isToday = index === 6;

                  return (
                    <div
                      key={d.dateStr}
                      onClick={() => {
                        vibrateSoft(5);
                        setActiveBarIndex(activeBarIndex === index ? null : index);
                      }}
                      className="flex-1 flex flex-col items-center h-full justify-end group cursor-pointer relative"
                    >
                      {isHovered && (
                        <div className="absolute -top-7 z-20 bg-[#1e293b] text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-md whitespace-nowrap animate-fadeIn">
                          {formatKip(d.total)} ກີບ
                        </div>
                      )}

                      <div className="w-full max-w-[28px] h-full flex items-end">
                        <div
                          style={{ height: `${heightPercent}%` }}
                          className={`w-full rounded-t-lg transition-all duration-300 ${
                            isToday
                              ? 'bg-gradient-to-t from-[#006c49] to-[#10b981] shadow-xs ring-2 ring-emerald-300/40'
                              : d.total > 0
                              ? 'bg-[#a7f3d0] hover:bg-[#10b981]'
                              : 'bg-gray-100'
                          }`}
                        />
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="flex justify-between items-center px-1">
                {stats.last7Days.map((d, index) => (
                  <div key={d.dateStr} className="flex-1 text-center">
                    <span className={`block text-[10px] font-bold ${index === 6 ? 'text-[#006c49]' : 'text-gray-500'}`}>
                      {d.dayLabel}
                    </span>
                    <span className="block text-[9px] text-gray-400 font-display">
                      {d.shortDate}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Sales by Category Breakdown */}
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-3 mb-4">
              <div className="flex items-center justify-between">
                <h3 className="font-display font-bold text-[15px] text-[#131b2e] flex items-center gap-1.5">
                  <span className="material-symbols-outlined text-[18px] text-[#10b981]">pie_chart</span>
                  <span>ສັດສ່ວນຍອດຂາຍຕາມໝວດໝູ່</span>
                </h3>
                <span className="text-[11px] font-display font-bold text-[#006c49]">
                  {formatKip(stats.totalSales)} ກີບ
                </span>
              </div>

              <div className="w-full h-3 bg-gray-100 rounded-full overflow-hidden flex shadow-inner">
                {Object.entries(stats.catSales).map(([key, cat]) => {
                  const percent = stats.totalSales > 0 ? (cat.revenue / stats.totalSales) * 100 : 0;
                  if (percent <= 0) return null;
                  return (
                    <div
                      key={key}
                      style={{ width: `${percent}%`, backgroundColor: cat.color }}
                      className="h-full transition-all duration-500"
                      title={`${cat.name}: ${percent.toFixed(1)}%`}
                    />
                  );
                })}
              </div>

              <div className="grid grid-cols-3 gap-2 pt-1">
                {Object.entries(stats.catSales).map(([key, cat]) => {
                  const percent = stats.totalSales > 0 ? Math.round((cat.revenue / stats.totalSales) * 100) : 0;
                  return (
                    <div key={key} className="bg-[#faf8ff] p-2.5 rounded-xl border border-gray-100 flex flex-col gap-1">
                      <div className="flex items-center gap-1 text-[11px] font-bold text-[#131b2e]">
                        <span className="w-2 h-2 rounded-full" style={{ backgroundColor: cat.color }}></span>
                        <span className="truncate">{cat.name}</span>
                      </div>
                      <span className="font-display font-black text-[13px] text-[#006c49]">
                        {formatKip(cat.revenue)}
                      </span>
                      <div className="flex items-center justify-between text-[10px] text-gray-400">
                        <span>{cat.count} ລາຍການ</span>
                        <span className="font-bold">{percent}%</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Top 5 Best Sellers List */}
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-3 mb-4">
              <div className="flex items-center justify-between">
                <h3 className="font-display font-bold text-[15px] text-[#131b2e] flex items-center gap-1.5">
                  <span className="material-symbols-outlined text-[18px] text-[#f59e0b]">stars</span>
                  <span>5 ເມນູຂາຍດີທີ່ສຸດ</span>
                </h3>
                <span className="text-[11px] text-gray-400 font-semibold">ລຽງຕາມຈຳນວນຂາຍ</span>

      function buildDeliveryPaymentSlip(order, deliveryData = {}, profile = {}) {
        const collector = deliveryData.collectorName || order.collectorName || 'ໂຈ້';
        const method = deliveryData.paymentMethod || order.paymentMethod || 'BCEL One QR';
        const note = deliveryData.collectorNote !== undefined ? deliveryData.collectorNote : (order.collectorNote || order.notes || '');
        const dateStr = formatDateTimeLao(deliveryData.deliveredAt || new Date().toISOString());

        const lines = [
          `✅ *ຢືນຢັນການຈັດສົ່ງ & ຮັບເງິນສຳເລັດ*`,
          `🏪 *ຮ້ານ:* ${order.storeName || profile.name || 'Beerlao POS'}`,
          `🔢 *ລະຫັດບິນ:* ${order.id}`,
          `👤 *ລູກຄ້າ:* ${order.customerName || 'ລູກຄ້າທົ່ວໄປ'}`,
          `📱 *ເບີໂທ:* ${order.customerPhone || order.phone || '-'}`,
          `⏰ *ເວລາສຳເລັດ:* ${dateStr}`,
          `---------------------------`,
          `📋 *ລາຍການອາຫານ & ເຄື່ອງດື່ມ:*`,
        ];

        (order.items || []).forEach((it, idx) => {
          lines.push(`${idx + 1}. ${it.productName} × ${it.quantity} = ${formatKip(it.unitPrice * it.quantity)} ກີບ`);
        });

        lines.push(`---------------------------`);
        lines.push(`💰 *ຍອດເງິນທີ່ຊຳລະ:* *${formatKip(order.total)} ກີບ*`);
        lines.push(`💳 *ວິທີຊຳລະ:* ${method}`);
        lines.push(`👤 *ພະນັກງານເກັບເງິນ:* *${collector}*`);

        const proof = deliveryData.paymentProof || order.paymentProof;
        if (proof) {
          lines.push(`📸 *ຫຼັກຖານການຈ່າຍ:* (ແນບຮູບສະລິບ/ເງິນສົດພ້ອມຂໍ້ຄວາມ)`);
        }

        if (note && note.trim()) {
          lines.push(`📝 *ໝາຍເຫດ:* ${note.trim()}`);
        }

        lines.push(`---------------------------`);
        lines.push(`🙏 *ຂອບໃຈທີ່ໃຊ້ບໍລິການ! (Beerlao POS)*`);
        return lines.join('\n');
      }

      async function sharePaymentProofToWhatsApp(order, deliveryData = {}, profile = {}, onShowToast = null) {
        const textSlip = buildDeliveryPaymentSlip(order, deliveryData, profile);
        const photoUrl = deliveryData.paymentProof || order.paymentProof;

        // 1. ຖ້າມີຮູບສະລິບ ແລະ Browser ຮອງຮັບ Web Share API ຈະແນບທັງຮູບ ແລະ ຂໍ້ຄວາມເຂົ້າ WhatsApp
        if (photoUrl && typeof navigator !== 'undefined' && navigator.canShare) {
          try {
            const photoFile = dataURLtoFile(photoUrl, `PaymentProof_${order.id}.jpg`);
            if (photoFile && navigator.canShare({ files: [photoFile] })) {
              await navigator.share({
                title: `ຫຼັກຖານການຈ່າຍ ${order.id}`,
                text: textSlip,
                files: [photoFile],
              });
              if (onShowToast) onShowToast('ສົ່ງຫຼັກຖານການຈ່າຍເຂົ້າ WhatsApp ສຳເລັດ! 🎉', 'success');
              return true;
            }
          } catch (err) {
            if (err.name === 'AbortError') return false;
          }
        }

        // 2. Fallback: ເປີດ WhatsApp URL ໂດຍກົງ
        const encoded = encodeURIComponent(textSlip);
        let targetUrl = `https://api.whatsapp.com/send?text=${encoded}`;
        const phone = order.customerPhone || order.phone;
        if (order.dispatchMode === 'direct' && phone) {
          let cleanPhone = phone.replace(/[\s\-\(\)\+]/g, '');
          if (cleanPhone.startsWith('020')) cleanPhone = '85620' + cleanPhone.slice(3);
          else if (cleanPhone.startsWith('20')) cleanPhone = '856' + cleanPhone;
          targetUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encoded}`;
        }
        window.open(targetUrl, '_blank');
        if (onShowToast) {
          onShowToast('ເປີດ WhatsApp ສົ່ງຂໍ້ມູນ & ສະລິບການຈ່າຍ...', 'info');
        }
        return true;
      }

                                onClick={() => setDeletingCashierId(null)}
                                className="px-2 py-1 bg-white hover:bg-gray-100 text-gray-700 font-bold text-[11px] rounded-lg border border-gray-200 active:scale-95 transition-all"
                              >
                                ຍົກເລີກ
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Close Button */}
              <button
                type="button"
                onClick={onClose}
                className="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs active:scale-95 transition-all"
              >
                ປິດໜ້າຕ່າງ (Done)
              </button>
            </div>
          </div>
        );
      };

      const ConfirmDeliveryModal = ({
        isOpen,
        onClose,
        order,
        profile,
        cashiers = INITIAL_CASHIERS,
        onUpdateCashiers,
        onConfirm,
        onShowToast,
      }) => {
        if (!isOpen || !order) return null;

        const [isManagingCashiers, setIsManagingCashiers] = useState(false);
        const [selectedCollector, setSelectedCollector] = useState(() => order.collectorName || (cashiers[0]?.name || 'ໂຈ້'));
        const [selectedCollectorPhoto, setSelectedCollectorPhoto] = useState(() => {
          if (order.collectorPhoto) return order.collectorPhoto;
          const found = (cashiers || []).find((c) => c.name === (order.collectorName || 'ໂຈ້'));
          return found ? found.photo : null;
        });
        const [paymentProof, setPaymentProof] = useState(() => order.paymentProof || null);
        const [paymentMethod, setPaymentMethod] = useState(() => order.paymentMethod || 'BCEL One QR');
        const [note, setNote] = useState(() => order.collectorNote || '');
        const [isCompressing, setIsCompressing] = useState(false);
        const [isSharingWhatsApp, setIsSharingWhatsApp] = useState(false);
        const cameraRef = useRef(null);
        const galleryRef = useRef(null);

        useEffect(() => {
          if (cashiers && cashiers.length > 0) {
            const current = cashiers.find((c) => c.name === selectedCollector);
            if (!current) {
              setSelectedCollector(cashiers[0].name);
              setSelectedCollectorPhoto(cashiers[0].photo || null);
            } else if (current.photo !== selectedCollectorPhoto) {
              setSelectedCollectorPhoto(current.photo || null);
            }
          }
        }, [cashiers]);

        const handlePhoto = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            setIsCompressing(true);
            const compressed = await compressImage(file, 960, 0.85);
            setPaymentProof(compressed);
            if (onShowToast) onShowToast('ອັບໂຫຼດຫຼັກຖານການຈ່າຍສຳເລັດ! 📸', 'success');
          } catch (err) {
            if (onShowToast) onShowToast('ເກີດຂໍ້ຜິດພາດໃນການອັບໂຫຼດຮູບ', 'error');
          } finally {
            setIsCompressing(false);
          }
        };

        const handleConfirmAndSendWhatsApp = async () => {
          vibrateSoft(40);
          setIsSharingWhatsApp(true);
          const foundCashier = (cashiers || []).find((c) => c.name === selectedCollector);
          const deliveryData = {
            status: 'delivered',
            collectorName: selectedCollector,
            collectorPhoto: selectedCollectorPhoto || (foundCashier?.photo || null),
            paymentProof: paymentProof,
            paymentMethod: paymentMethod,
            collectorNote: note.trim(),
            deliveredAt: new Date().toISOString(),
          };
          onConfirm(order.id, deliveryData);
          onClose();
          await sharePaymentProofToWhatsApp(order, deliveryData, profile, onShowToast);
          setIsSharingWhatsApp(false);
        };

        const handleSave = () => {
          vibrateSoft(35);
          const foundCashier = (cashiers || []).find((c) => c.name === selectedCollector);
          onConfirm(order.id, {
            status: 'delivered',
            collectorName: selectedCollector,
            collectorPhoto: selectedCollectorPhoto || (foundCashier?.photo || null),
            paymentProof: paymentProof,
            paymentMethod: paymentMethod,
            collectorNote: note.trim(),
            deliveredAt: new Date().toISOString(),
          });
          onClose();
        };

        return (
          <>
            <div className="fixed inset-0 z-[1100] flex items-center justify-center p-3 pb-24 sm:pb-4 sm:p-4 bg-black/65 backdrop-blur-xs animate-fadeIn">
              <input type="file" ref={cameraRef} accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" />
              <input type="file" ref={galleryRef} accept="image/*" onChange={handlePhoto} className="hidden" />

              <div className="bg-white rounded-3xl max-w-sm w-full p-4 sm:p-5 shadow-2xl border border-emerald-900/10 flex flex-col gap-3.5 max-h-[82vh] overflow-y-auto no-scrollbar">
                {/* Header */}
                <div className="flex items-center justify-between border-b border-gray-100 pb-2.5">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#006c49] to-[#10b981] text-white flex items-center justify-center shadow-md shadow-emerald-900/15 shrink-0">
                      <span className="material-symbols-outlined text-[24px]">verified</span>
                    </div>
                    <div>
                      <h3 className="font-display font-black text-[16px] text-[#006c49] leading-tight">
                        ຢືນຢັນການສົ່ງ & ຫຼັກຖານການຈ່າຍ
                      </h3>
                      <p className="text-[11px] text-[#3c4a42]">
                        ເລືອກຄົນເກັບເງິນ ແລະ ຖ່າຍຮູບຫຼັກຖານ
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={onClose}
                    className="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition-colors shrink-0"
                  >
                    <span className="material-symbols-outlined text-[18px]">close</span>
                  </button>
                </div>

                {/* Order Info Strip */}
                <div className="bg-[#faf8ff] p-3 rounded-2xl border border-gray-100 flex items-center justify-between text-xs">
                  <div className="min-w-0">
                    <span className="font-display font-black text-[#006c49] text-[14px] block">
                      {order.id}
                    </span>
                    <span className="text-[11px] text-gray-500 truncate block mt-0.5">
                      {order.customerName || 'ລູກຄ້າທົ່ວໄປ'} ({order.customerPhone || order.phone || '-'})
                    </span>
                  </div>
                  <div className="text-right shrink-0">
                    <span className="font-display font-black text-[17px] text-[#006c49] block leading-tight">
                      {formatKip(order.total)}
                    </span>
                    <span className="text-[10px] text-gray-400 font-bold">ກີບ</span>
                  </div>
                </div>

                {/* Cashier / Collector Selection */}
                <div className="flex flex-col gap-1.5">
                  <div className="flex items-center justify-between">
                    <label className="text-[12px] font-bold text-[#131b2e] flex items-center gap-1.5">
                      <span className="material-symbols-outlined text-[17px] text-[#006c49]">badge</span>
                      <span>ເລືອກຄົນເກັບເງິນ (Cashier) *</span>
                    </label>
                    <button
                      type="button"
                      onClick={() => setIsManagingCashiers(true)}
                      className="text-[11px] font-bold text-[#006c49] hover:text-[#005236] bg-[#ecfdf5] hover:bg-emerald-100 px-2 py-0.5 rounded-lg border border-[#a7f3d0] flex items-center gap-1 active:scale-95 transition-all shadow-2xs"
                    >
                      <span className="material-symbols-outlined text-[14px]">person_add</span>
                      <span>+ ເພີ່ມ / ຈັດການ</span>
                    </button>
                  </div>

                  <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                    {cashiers.map((c) => {
                      const isSelected = selectedCollector === c.name;
                      return (
                        <button
                          key={c.id || c.name}
                          type="button"
                          onClick={() => {
                            vibrateSoft(10);
                            setSelectedCollector(c.name);
                            setSelectedCollectorPhoto(c.photo || null);
                          }}
                          className={`p-2 rounded-2xl text-xs font-bold transition-all flex flex-col items-center justify-center gap-1 border active:scale-95 relative ${
                            isSelected
                              ? 'bg-[#ecfdf5] text-[#006c49] border-[#006c49] ring-2 ring-[#006c49] shadow-sm shadow-emerald-900/15'
                              : 'bg-white hover:bg-gray-50 text-gray-800 border-gray-200'
                          }`}
                        >
                          <div className="relative">
                            {c.photo ? (
                              <img
                                src={c.photo}
                                alt={c.name}
                                className={`w-10 h-10 rounded-full object-cover border-2 shadow-xs ${
                                  isSelected ? 'border-[#006c49]' : 'border-gray-200'
                                }`}
                              />
                            ) : (
                              <div
                                className="w-10 h-10 rounded-full flex items-center justify-center text-white font-black text-xs shadow-xs"
                                style={{ backgroundColor: c.color || '#006c49' }}
                              >
                                {c.name.slice(0, 2)}
                              </div>
                            )}
                            {isSelected && (
                              <span className="absolute -bottom-1 -right-1 w-4 h-4 bg-[#006c49] text-white rounded-full flex items-center justify-center text-[10px] shadow-xs">
                                <span className="material-symbols-outlined text-[11px]">check</span>
                              </span>
                            )}
                          </div>
                          <span className="truncate text-[11px] max-w-full text-center font-bold">{c.name}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Payment Proof Photo Section */}
                <div className="flex flex-col gap-1.5">
                  <div className="flex items-center justify-between">
                    <label className="text-[12px] font-bold text-[#131b2e] flex items-center gap-1.5">
                      <span className="material-symbols-outlined text-[17px] text-[#006c49]">photo_camera</span>
                      <span>ຮູບຫຼັກຖານການຈ່າຍ (Slip / ເງິນສົດ)</span>
                    </label>
                    {paymentProof && (
                      <span className="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                        ✓ ມີຮູບແລ້ວ
                      </span>
                    )}
                  </div>

                  {paymentProof ? (
                    <div className="relative rounded-2xl overflow-hidden border border-emerald-300 bg-gray-50 flex flex-col">
                      <div className="relative h-44 w-full bg-black/5 flex items-center justify-center overflow-hidden">
                        <img
                          src={paymentProof}
                          alt="Payment Proof"
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <div className="p-2 bg-[#ecfdf5] border-t border-[#a7f3d0] flex items-center justify-between gap-1">
                        <div className="flex items-center gap-1">
                          <button
                            type="button"
                            onClick={() => cameraRef.current?.click()}
                            className="px-2.5 py-1 bg-white hover:bg-emerald-50 text-[#006c49] font-bold text-[11px] rounded-lg border border-[#a7f3d0] active:scale-95 transition-all flex items-center gap-1"
                          >
                            <span className="material-symbols-outlined text-[14px]">photo_camera</span>
                            <span>ຖ່າຍໃໝ່</span>
                          </button>
                          <button
                            type="button"
                            onClick={() => galleryRef.current?.click()}
                            className="px-2.5 py-1 bg-white hover:bg-gray-50 text-gray-700 font-bold text-[11px] rounded-lg border border-gray-200 active:scale-95 transition-all flex items-center gap-1"
                          >
                            <span className="material-symbols-outlined text-[14px]">photo_library</span>
                            <span>ຄັງພາບ</span>
                          </button>
                        </div>
                        <button
                          type="button"
                          onClick={() => setPaymentProof(null)}
                          className="px-2 py-1 text-rose-600 hover:bg-rose-50 font-bold text-[11px] rounded-lg border border-rose-200 transition-colors"
                        >
                          ລຶບຮູບ
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => cameraRef.current?.click()}
                        disabled={isCompressing}
                        className="py-3.5 px-3 bg-[#ecfdf5] hover:bg-emerald-100 text-[#006c49] rounded-2xl border-2 border-dashed border-[#a7f3d0] font-bold text-xs flex flex-col items-center justify-center gap-1.5 active:scale-95 transition-all shadow-2xs"
                      >
                        <span className="material-symbols-outlined text-[26px]">photo_camera</span>
                        <span>{isCompressing ? 'ກຳລັງປະມວນຜົນ...' : '📷 ເປີດກ້ອງຖ່າຍຮູບ'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => galleryRef.current?.click()}
                        disabled={isCompressing}
                        className="py-3.5 px-3 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-2xl border-2 border-dashed border-gray-200 font-bold text-xs flex flex-col items-center justify-center gap-1.5 active:scale-95 transition-all shadow-2xs"
                      >
                        <span className="material-symbols-outlined text-[26px]">photo_library</span>
                        <span>🖼️ ເລືອກຈາກຄັງພາບ</span>
                      </button>
                    </div>
                  )}
                </div>

                {/* Payment Method Pills */}
                <div className="flex flex-col gap-1.5">
                  <label className="text-[12px] font-bold text-[#131b2e] flex items-center gap-1.5">
                    <span className="material-symbols-outlined text-[17px] text-[#006c49]">payments</span>
                    <span>ວິທີຊຳລະເງິນ</span>
                  </label>
                  <div className="grid grid-cols-3 gap-1.5">
                    {[
                      { id: 'BCEL One QR', label: 'BCEL One', icon: 'qr_code_2' },
                      { id: 'ເງິນສົດ', label: 'ເງິນສົດ', icon: 'attach_money' },
                      { id: 'ໂອນບັນຊີ', label: 'ໂອນບັນຊີ', icon: 'account_balance' },
                    ].map((pm) => {
                      const isSelected = paymentMethod === pm.id;
                      return (
                        <button
                          key={pm.id}
                          type="button"
                          onClick={() => {
                            vibrateSoft(10);
                            setPaymentMethod(pm.id);
                          }}
                          className={`py-1.5 px-2 rounded-xl text-[11px] font-bold transition-all flex items-center justify-center gap-1 border active:scale-95 ${
                            isSelected
                              ? 'bg-[#006c49] text-white border-[#006c49] shadow-xs'
                              : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-50'
                          }`}
                        >
                          <span className="material-symbols-outlined text-[14px]">{pm.icon}</span>
                          <span>{pm.label}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Note input */}
                <div>
                  <label className="text-[11px] font-bold text-gray-600 block mb-1">
                    ໝາຍເຫດເພີ່ມເຕີມ (ທາງເລືອກ)
                  </label>
                  <input
                    type="text"
                    value={note}
                    onChange={(e) => setNote(e.target.value)}
                    placeholder="ຕົວຢ່າງ: ລູກຄ້າຈ່າຍສົດ, ໂອນເຂົ້າບັນຊີຮ້ານ..."
                    className="w-full px-3 py-2 bg-[#faf8ff] rounded-xl border border-gray-200 text-xs font-semibold text-gray-900 focus:outline-none focus:ring-1 focus:ring-[#006c49]"
                  />
                </div>

                {/* Actions */}
                <div className="flex flex-col gap-2 pt-1 border-t border-gray-100">
                  <button
                    type="button"
                    onClick={handleConfirmAndSendWhatsApp}
                    disabled={isSharingWhatsApp}
                    className="w-full py-3 px-4 bg-gradient-to-r from-[#25d366] to-[#128c7e] hover:from-[#20ba5a] hover:to-[#0d7367] text-white font-bold rounded-2xl text-[13px] shadow-lg shadow-emerald-900/15 flex items-center justify-center gap-2 active:scale-95 transition-all"
                  >
                    <span className="material-symbols-outlined text-[20px]">chat</span>
                    <span>{paymentProof ? 'ຢືນຢັນ & ສົ່ງຮູບສະລິບເຂົ້າ WhatsApp' : 'ຢືນຢັນ & ສົ່ງຂໍ້ມູນເຂົ້າ WhatsApp'}</span>
                  </button>

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={onClose}
                      className="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs active:scale-95 transition-all"
                    >
                      ຍົກເລີກ
                    </button>
                    <button
                      type="button"
                      onClick={handleSave}
                      className="flex-1 py-2.5 bg-[#006c49] hover:bg-[#005236] text-white font-bold rounded-xl text-xs shadow-md shadow-emerald-900/20 flex items-center justify-center gap-1.5 active:scale-95 transition-all"
                    >
                      <span className="material-symbols-outlined text-[16px]">check_circle</span>
                      <span>ຢືນຢັນເທົ່ານັ້ນ ✓</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <CashierManagementModal
              isOpen={isManagingCashiers}
              onClose={() => setIsManagingCashiers(false)}
              cashiers={cashiers}
              onUpdateCashiers={onUpdateCashiers}
              onShowToast={onShowToast}
            />
          </>
        );
      };

      const OrdersTab = ({
        orders,
        onDeleteOrder,
        onClearAllOrders,
        onToggleOrderStatus,
        profile,
        cashiers = INITIAL_CASHIERS,
        onUpdateCashiers,
        onShowToast,
      }) => {
        const [showClearConfirm, setShowClearConfirm] = useState(false);
        const [orderToDelete, setOrderToDelete] = useState(null);
        const [expandedOrders, setExpandedOrders] = useState({});
        const [selectedOrderDetail, setSelectedOrderDetail] = useState(null);
        const [printReceiptOrder, setPrintReceiptOrder] = useState(null);
        const [confirmingOrder, setConfirmingOrder] = useState(null);
        const [viewingProofImage, setViewingProofImage] = useState(null);
        const [isCashierModalOpen, setIsCashierModalOpen] = useState(false);

        const toggleExpand = (id) => {
          vibrateSoft(10);
          setExpandedOrders((prev) => ({ ...prev, [id]: !prev[id] }));
        };

        const handleConfirmDelivery = (orderId, deliveryData) => {
          vibrateSoft(35);
          onToggleOrderStatus(orderId, deliveryData);
          try {
            confetti({ particleCount: 65, spread: 70, origin: { y: 0.7 } });
            playFeedbackSound('success');
          } catch (e) {}
          onShowToast(`ຢືນຢັນ: ສົ່ງອໍເດີແລ້ວ! ຄົນເກັບ: ${deliveryData.collectorName} 🎉`, 'success');
        };

        const handleToggle = (orderId, currentStatus) => {
          vibrateSoft(35);
          const nextStatus = currentStatus === 'delivered' ? 'pending' : 'delivered';
          onToggleOrderStatus(orderId, { status: nextStatus });
          if (nextStatus === 'delivered') {
            try {
              confetti({ particleCount: 55, spread: 65, origin: { y: 0.7 } });
              playFeedbackSound('success');
            } catch (e) {}
            onShowToast(`ຢືນຢັນ: ສົ່ງອໍເດີແລ້ວ! 🎉`, 'success');
          } else {
            onShowToast(`ປ່ຽນສະຖານະ: ຍັງບໍ່ທັນສົ່ງ ⏳`, 'info');
          }
        };

        const handleResendWhatsApp = async (order) => {
          vibrateSoft(20);
          if (order.status === 'delivered') {
            await sharePaymentProofToWhatsApp(order, order, profile, onShowToast);
            return;
          }
          const cartItems = (order.items || []).map((it) => ({
            product: {
              id: it.productId,
              name: it.productName,
              nameEn: it.productNameEn || '',
              sub: '',
              category: it.category || 'drinks',
              price: it.unitPrice,
            },
            quantity: it.quantity,
          }));

          const orderProfile = {
            ...profile,
            name: order.storeName || profile.name,
            customerName: order.customerName || profile.customerName,
            customerPhone: order.customerPhone || profile.customerPhone,
            ownerName: order.ownerName || profile.ownerName,
            lat: order.location?.lat ?? profile.lat,
            lng: order.location?.lng ?? profile.lng,
            photoUrl: order.storePhoto ?? profile.photoUrl,
            whatsappMode: order.dispatchMode || profile.whatsappMode,
          };

          const textSlip = buildWhatsAppSlip(
            cartItems,
            order.subtotal,
            order.discount,
            order.total,
            order.notes || '',
            orderProfile,
            order.id,
            order.cashGiven || 0,
            order.change || 0
          );

          const encoded = encodeURIComponent(textSlip);
          let targetUrl = `https://api.whatsapp.com/send?text=${encoded}`;
          if (order.dispatchMode === 'direct' && (order.customerPhone || order.phone)) {
            let cleanPhone = (order.customerPhone || order.phone).replace(/[\s\-\(\)\+]/g, '');
            if (cleanPhone.startsWith('020')) cleanPhone = '85620' + cleanPhone.slice(3);
            else if (cleanPhone.startsWith('20')) cleanPhone = '856' + cleanPhone;
            targetUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encoded}`;
          }
          window.open(targetUrl, '_blank');
          onShowToast(`ເປີດ WhatsApp ສົ່ງບິນ ${order.id}...`, 'info');
        };

        return (
          <div className="flex flex-col w-full pb-36 max-w-lg mx-auto px-4 pt-2">
            <ConfirmModal
              isOpen={!!orderToDelete}
              title={`ລຶບບິນ ${orderToDelete}?`}
              message="ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບບິນລາຍການນີ້ອອກຈາກລະບົບ?"
              onCancel={() => setOrderToDelete(null)}
              onConfirm={() => {
                if (orderToDelete) {
                  vibrateSoft(30);
                  onDeleteOrder(orderToDelete);
                  onShowToast(`ລຶບບິນ ${orderToDelete} ຮຽບຮ້ອຍແລ້ວ`, 'info');
                  setOrderToDelete(null);
                }

                                ກົດຢືນຢັນ: ສັ່ງອໍເດີແລ້ວ
                              </span>
                            </div>
                          </div>
                          <button
                            type="button"
                            onClick={() => {
                              vibrateSoft(20);
                              setConfirmingOrder(order);
                            }}
                            className="bg-white hover:bg-orange-50 text-orange-600 font-black text-[12px] px-3.5 py-1.5 rounded-xl shadow-md shrink-0 flex items-center gap-1 active:scale-95 transition-all"
                          >
                            <span className="material-symbols-outlined text-[16px] text-orange-600">check_circle</span>
                            <span>ຢືນຢັນ</span>
                          </button>
                        </div>
                      )}

                      {/* Customer Info */}
                      <div className="flex items-center gap-1.5 text-xs text-[#131b2e] px-0.5">
                        <span className="material-symbols-outlined text-[16px] text-gray-400">person</span>
                        <span className="font-black text-[#131b2e] text-[13px]">
                          {order.customerName || 'ລູກຄ້າທົ່ວໄປ'}
                        </span>
                        <span className="text-gray-500 font-display font-medium text-[12px]">
                          ({order.customerPhone || order.phone || '-'})
                        </span>
                      </div>

                      {/* Order Items Box with Notes & Toggle */}
                      <div className="bg-[#faf8ff] p-3 rounded-2xl border border-gray-100 flex flex-col gap-2 text-xs">
                        <div className="flex items-center justify-between">
                          <span className="font-semibold text-gray-700 truncate flex-1 pr-2">
                            {(order.items || []).map((it) => `${it.productName} (x${it.quantity})`).join(', ')}
                          </span>
                          <button
                            type="button"
                            onClick={() => toggleExpand(order.id)}
                            className="text-[11px] font-bold text-[#006c49] hover:underline flex items-center gap-0.5 shrink-0"
                          >
                            <span>{isExpanded ? 'ຫຍໍ້' : 'ແຍກລາຍການ'}</span>
                            <span className="material-symbols-outlined text-[15px]">
                              {isExpanded ? 'expand_less' : 'expand_more'}
                            </span>
                          </button>
                        </div>

                        {/* Collapsible item details */}
                        {isExpanded && (
                          <div className="pt-2 mt-1 border-t border-gray-200/80 flex flex-col gap-1 text-[11px]">
                            {(order.items || []).map((it, idx) => (
                              <div key={idx} className="flex justify-between items-center text-gray-700 py-0.5">
                                <span>• {it.productName} × {it.quantity}</span>
                                <span className="font-display font-bold text-[#006c49]">
                                  {formatKip(it.unitPrice * it.quantity)} ກີບ
                                </span>
                              </div>
                            ))}
                            {order.discount > 0 && (
                              <div className="flex justify-between items-center text-rose-600 pt-1 border-t border-gray-100">
                                <span>ສ່ວນຫຼຸດ:</span>
                                <span className="font-display font-bold">-{formatKip(order.discount)} ກີບ</span>
                              </div>
                            )}
                          </div>
                        )}

                        {order.notes && (
                          <div className="bg-[#fffbeb] text-amber-900 px-3 py-1.5 rounded-xl border border-amber-200/80 text-[11px] font-medium flex items-center gap-1.5 w-full">
                            <span>📝</span>
                            <span className="font-bold">ໝາຍເຫດ:</span>
                            <span>{order.notes}</span>
                          </div>
                        )}
                      </div>

                      {/* Summary Row */}
                      <div className="flex items-center justify-between px-0.5 pt-0.5">
                        <span className="text-[12px] text-gray-500 font-bold">
                          {totalQty} ລາຍການ
                        </span>
                        <div className="flex items-baseline gap-1 text-[#006c49]">
                          <span className="font-display font-black text-[22px] leading-none">
                            {formatKip(order.total)}
                          </span>
                          <span className="text-[13px] font-bold text-[#006c49]">ກີບ</span>
                        </div>
                      </div>

                      {/* Action Buttons */}
                      <div className="flex items-center gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => handleResendWhatsApp(order)}
                          className="flex-1 h-9 px-3 bg-[#25d366] hover:bg-[#20ba5a] text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-xs active:scale-95 transition-all"
                        >
                          <span className="material-symbols-outlined text-[17px]">chat</span>
                          <span>WhatsApp</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => {
                            vibrateSoft(15);
                            setSelectedOrderDetail(order);
                          }}
                          className="h-9 px-3 rounded-xl bg-[#ecfdf5] hover:bg-emerald-100 text-[#006c49] text-xs font-bold flex items-center justify-center gap-1 border border-[#a7f3d0] active:scale-95 transition-all"
                          title="ເບິ່ງລາຍລະອຽດເຕັມ"
                        >
                          <span className="material-symbols-outlined text-[16px]">visibility</span>
                          <span>ລາຍລະອຽດ</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => {
                            vibrateSoft(15);
                            setPrintReceiptOrder(order);
                          }}
                          className="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 text-[#006c49] flex items-center justify-center transition-colors shrink-0"
                          title="ພິມໃບບິນ"
                        >
                          <span className="material-symbols-outlined text-[17px]">print</span>
                        </button>

                        {order.location && (
                          <a
                            href={`https://www.google.com/maps?q=${order.location.lat},${order.location.lng}`}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="w-9 h-9 rounded-xl bg-gray-100 hover:bg-gray-200 text-[#006c49] flex items-center justify-center transition-colors shrink-0"
                            title="ເປີດແຜນທີ່ສົ່ງ"
                          >
                            <span className="material-symbols-outlined text-[17px]">location_on</span>
                          </a>
                        )}

                        <button
                          type="button"
                          onClick={() => {
                            vibrateSoft(15);
                            setOrderToDelete(order.id);
                          }}
                          className="w-9 h-9 rounded-xl hover:bg-rose-50 text-gray-400 hover:text-rose-600 flex items-center justify-center transition-colors shrink-0"
                          title="ລຶບບິນນີ້"
                        >
                          <span className="material-symbols-outlined text-[17px]">delete</span>
                        </button>
                      </div>
                    </article>
                  );
                })}

                <div className="pt-3 text-center">
                  <button
                    type="button"
                    onClick={() => setShowClearConfirm(true)}
                    className="text-[12px] text-gray-400 hover:text-rose-600 transition-colors font-semibold underline active:opacity-75"
                  >
                    ລຶບປະຫວັດບິນທັງໝົດ (Clear All Orders)
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      };


      const PRESET_FOOD_PHOTOS = [
        { label: 'ກາເຟເຢັນ', url: 'https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=500&auto=format&fit=crop&q=80' },
        { label: 'ຊານົມໄຂ່ມຸກ', url: 'https://images.unsplash.com/photo-1558160074-4d7d8bdf4256?w=500&auto=format&fit=crop&q=80' },
        { label: 'ເຝີ / ຕົ້ມເສັ້ນ', url: 'https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=500&auto=format&fit=crop&q=80' },
        { label: 'ກະເພົາ / ຜັດ', url: 'https://images.unsplash.com/photo-1562967914-608f82629710?w=500&auto=format&fit=crop&q=80' },
        { label: 'ຕຳໝາກຫຸ່ງ', url: 'https://images.unsplash.com/photo-1559847844-5315695dadae?w=500&auto=format&fit=crop&q=80' },
        { label: 'ຂອງຫວານ', url: 'https://images.unsplash.com/photo-1621303837174-89787a7d4729?w=500&auto=format&fit=crop&q=80' },
        { label: 'ນ້ຳປັ່ນ / ໝາກໄມ້', url: 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?w=500&auto=format&fit=crop&q=80' },
        { label: 'ເຂົ້າຜັດ', url: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=500&auto=format&fit=crop&q=80' },
      ];

      const CatalogTab = ({
        products,
        profile,
        onOpenStoreSettings,
        onAddProduct,
        onUpdateProduct,
        onDeleteProduct,
        onResetProducts,
        onShowToast,
        onReloadMenu,
      }) => {
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [productToDelete, setProductToDelete] = useState(null);
        const [showResetConfirm, setShowResetConfirm] = useState(false);
        const [selectedFilterCategory, setSelectedFilterCategory] = useState('all');

        const [name, setName] = useState('');
        const [nameEn, setNameEn] = useState('');
        const [sub, setSub] = useState('');
        const [category, setCategory] = useState('drinks');
        const [price, setPrice] = useState('25000');
        const [image, setImage] = useState('');
        const [badgeText, setBadgeText] = useState('');
        const [badgeType, setBadgeType] = useState('bestseller');
        const [isCompressing, setIsCompressing] = useState(false);
        const [isSyncingMenu, setIsSyncingMenu] = useState(false);
        const [isReloadingMenu, setIsReloadingMenu] = useState(false);
        const [isSavingProduct, setIsSavingProduct] = useState(false);
        const [saveProductStatus, setSaveProductStatus] = useState('');

        const handleSyncMenuToGoogleSheet = async () => {
          vibrateSoft(20);
          setIsSyncingMenu(true);
          try {
            const res = await syncProductsToGoogleSheet(products);
            if (res && res.success) {
              onShowToast(`ຊິ້ງເມນູ ແລະ ຮູບພາບ (${products.length} ລາຍການ) ລົງ Google Drive & Sheet ຮຽບຮ້ອຍ! 📸📊`, 'success');
            } else {
              onShowToast('ບັນທຶກເມນູໃນລະບົບແລ້ວ', 'info');
            }
          } catch (e) {
            onShowToast('ເກີດຂໍ້ຜິດພາດໃນການຊິ້ງເມນູ', 'error');
          } finally {
            setIsSyncingMenu(false);
          }
        };

        const handleReloadMenuFromSheet = async () => {
          vibrateSoft(20);
          setIsReloadingMenu(true);
          try {
            if (onReloadMenu) {
              const ok = await onReloadMenu();
              if (ok) {
                onShowToast('ດຶງເມນູຫຼ້າສຸດຈາກ Google Sheet ສຳເລັດ! 🍽️', 'success');
              } else {
                onShowToast('ບໍ່ພົບເມນູໃໝ່ໃນ Google Sheet', 'info');
              }
            }
          } catch (e) {
            onShowToast('ເກີດຂໍ້ຜິດພາດໃນການດຶງເມນູ', 'error');
          } finally {
            setIsReloadingMenu(false);
          }
        };

        const fileInputRef = useRef(null);

        const openAddModal = () => {
          vibrateSoft(15);
          setEditingProduct(null);
          setName('');
          setNameEn('');
          setSub('');
          setCategory('drinks');
          setPrice('25000');
          setImage(PRESET_FOOD_PHOTOS[0].url);
          setBadgeText('');
          setBadgeType('bestseller');
          setIsSavingProduct(false);
          setSaveProductStatus('');
          setIsModalOpen(true);
        };

        const openEditModal = (prod) => {
          vibrateSoft(15);
          setEditingProduct(prod);
          setName(prod.name || '');
          setNameEn(prod.nameEn || '');
          setSub(prod.sub || '');
          setCategory(prod.category || 'drinks');
          setPrice(String(prod.price || 0));
          setImage(prod.image || '');
          setBadgeText(prod.badgeText || '');
          setBadgeType(prod.badgeType || 'bestseller');
          setIsSavingProduct(false);
          setSaveProductStatus('');
          setIsModalOpen(true);
        };

        const handleImageUpload = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          try {
            setIsCompressing(true);
            const compressed = await compressImage(file, 400, 0.8);
            setImage(compressed);
            onShowToast('ເລືອກຮູບພາບສຳເລັດ! ກົດ "ບັນທຶກ" ເພື່ອອັບໂຫຼດລົງ Google Drive ☁️', 'success');
          } catch (err) {
            onShowToast('ເກີດຂໍ້ຜິດພາດໃນການອັບໂຫຼດຮູບພາບ', 'error');
          } finally {
            setIsCompressing(false);
          }
        };

        const handleSaveProduct = async (e) => {
          if (e && e.preventDefault) e.preventDefault();
          if (isSavingProduct) return;
          if (!name.trim()) {
            onShowToast('ກະລຸນາປ້ອນຊື່ເມນູອາຫານ/ເຄື່ອງດື່ມ', 'warning');
            return;
          }
          const numPrice = parseInt(price, 10);
          if (isNaN(numPrice) || numPrice < 0) {
            onShowToast('ກະລຸນາປ້ອນລາຄາທີ່ຖືກຕ້ອງ', 'warning');
            return;
          }

          setIsSavingProduct(true);
          let finalImageUrl = image || PRESET_FOOD_PHOTOS[0].url;
          let driveFileId = editingProduct?.driveFileId || '';
          let driveViewUrl = editingProduct?.driveViewUrl || '';

          // 1. ຖ້າເປັນຮູບພາບ Base64: ໃຫ້ອັບໂຫຼດລົງ Google Drive ໂຟນເດີ 1JFlPMCT6FyANB_3XN7wFhaGIQK7NEU2x ກ່ອນ!
          if (finalImageUrl && finalImageUrl.startsWith('data:image')) {
            setSaveProductStatus('ກຳລັງອັບໂຫຼດຮູບເຂົ້າ Google Drive... ☁️');
            try {
              const driveRes = await uploadImageToGoogleDrive(finalImageUrl, 'Menu_' + name.trim(), 'menu');
              if (driveRes && (driveRes.directUrl || driveRes.status === 'success')) {
                finalImageUrl = driveRes.directUrl;
                driveFileId = driveRes.fileId || driveFileId;
                driveViewUrl = driveRes.viewUrl || driveViewUrl;
              } else {
                console.warn('Drive image upload returned fallback:', driveRes);
              }
            } catch (uploadErr) {
              console.warn('Drive image upload error:', uploadErr);
            }
          }

          const productPayload = {
            id: editingProduct ? editingProduct.id : `item-${Date.now()}`,
            name: name.trim(),
            nameEn: nameEn.trim() || name.trim(),
            sub: sub.trim() || 'ເມນູພິເສດ',
            category,
            price: numPrice,
            image: finalImageUrl,
            driveFileId: driveFileId,
            driveViewUrl: driveViewUrl,
            badgeText: badgeText.trim() || undefined,
            badgeType: badgeText.trim() ? badgeType : undefined,
          };

          // 2. ບັນທຶກລົງ Google Sheet ແລະ ອັບເດດ State
          setSaveProductStatus('ກຳລັງບັນທຶກລົງ Google Sheet... 📊');
          try {
            if (editingProduct) {
              await onUpdateProduct(productPayload);
              onShowToast(`ແກ້ໄຂ ແລະ ບັນທຶກ "${productPayload.name}" ລົງ Drive & Sheet ສຳເລັດ! 🎉`, 'success');
            } else {
              await onAddProduct(productPayload);
              onShowToast(`ເພີ່ມເມນູໃໝ່ "${productPayload.name}" ລົງ Drive & Sheet ສຳເລັດ! 🎉`, 'success');
            }
            setIsModalOpen(false);
          } catch (err) {
            onShowToast(`ເກີດຂໍ້ຜິດພາດ: ${err.message || err}`, 'error');
          } finally {
            setIsSavingProduct(false);
            setSaveProductStatus('');
          }
        };

        const displayedProducts = useMemo(() => {
          if (selectedFilterCategory === 'all') return products;
          return products.filter((p) => p.category === selectedFilterCategory);
        }, [products, selectedFilterCategory]);

        return (
          <div className="flex flex-col w-full pb-36 max-w-lg mx-auto px-4 pt-2">
            <ConfirmModal
              isOpen={!!productToDelete}
              title={`ລຶບເມນູ "${productToDelete?.name}"?`}
              message="ທ່ານແນ່ໃຈບໍ່ວ່າຕ້ອງການລຶບເມນູນີ້ອອກຈາກລາຍການຂາຍ? (ເມນູຈະຖືກລຶບອອກຈາກກະຕ່າເຊັ່ນກັນ)"
              onCancel={() => setProductToDelete(null)}
              onConfirm={() => {
                if (productToDelete) {
                  vibrateSoft(30);
                  onDeleteProduct(productToDelete.id);
                  onShowToast(`ລຶບເມນູ "${productToDelete.name}" ຮຽບຮ້ອຍແລ້ວ`, 'info');
                  setProductToDelete(null);
                }
              }}
            />

            <ConfirmModal
              isOpen={showResetConfirm}
              title="ຣີເຊັດເມນູກັບຄືນຄ່າເລີ່ມຕົ້ນ?"
              message="ເມນູອາຫານທັງໝົດຈະຖືກຣີເຊັດກັບເປັນເມນູຕົວຢ່າງຕົ້ນສະບັບ."
              onCancel={() => setShowResetConfirm(false)}
              onConfirm={() => {
                vibrateSoft(35);
                onResetProducts();
                onShowToast('ຣີເຊັດເມນູເປັນຄ່າເລີ່ມຕົ້ນແລ້ວ', 'info');
                setShowResetConfirm(false);
              }}
            />

            <div className="flex items-center justify-between mb-3">
              <div>
                <h1 className="font-display font-bold text-[22px] text-[#006c49]">ຈັດການເມນູ & ຮ້ານຄ້າ</h1>
                <p className="text-[12px] text-[#3c4a42]">ທັງໝົດ {products.length} ລາຍການເມນູ</p>
              </div>
              <div className="flex items-center gap-1.5">
                <button
                  type="button"
                  onClick={onOpenStoreSettings}
                  className="py-2 px-3 bg-[#ecfdf5] hover:bg-emerald-100 text-[#006c49] font-bold text-[12px] rounded-xl flex items-center gap-1 border border-[#a7f3d0] active:scale-95 transition-all"
                  title="ຕັ້ງຄ່າຂໍ້ມູນຮ້ານ"
                >
                  <span className="material-symbols-outlined text-[16px]">storefront</span>
                  <span>ຮ້ານຄ້າ</span>
                </button>
                <button
                  type="button"
                  onClick={openAddModal}
                  className="py-2 px-3.5 bg-gradient-to-r from-[#006c49] to-[#10b981] hover:from-[#005236] hover:to-[#059669] text-white font-bold text-[12px] rounded-xl flex items-center gap-1 shadow-md shadow-emerald-900/15 active:scale-95 transition-all"
                >
                  <span className="material-symbols-outlined text-[18px]">add_circle</span>
                  <span>+ ເພີ່ມເມນູ</span>
                </button>
              </div>
            </div>

            {/* Google Sheet Menu Sync Bar */}
            <div className="bg-[#ecfdf5] border border-[#a7f3d0] rounded-2xl p-2.5 mb-3 flex items-center justify-between gap-2 shadow-2xs">
              <div className="flex items-center gap-2 min-w-0">
                <div className="w-8 h-8 rounded-xl bg-white text-[#006c49] flex items-center justify-center font-bold shadow-2xs shrink-0 border border-[#a7f3d0]/60">
                  <span className="material-symbols-outlined text-[18px]">table_chart</span>
                </div>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <span className="text-xs font-bold text-[#006c49]">Google Sheet: ແທັບ "Menu"</span>
                    <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
                  </div>
                  <p className="text-[11px] text-[#005236] truncate">ບັນທຶກເມນູ & ຮູບພາບລົງ Google Drive & Sheet ອັດຕະໂນມັດ 📸</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  onClick={handleReloadMenuFromSheet}
                  disabled={isReloadingMenu}
                  className="py-1.5 px-2.5 bg-white hover:bg-emerald-50 text-[#006c49] border border-[#a7f3d0] disabled:opacity-50 rounded-xl text-[11px] font-bold flex items-center gap-1 active:scale-95 transition-all shadow-2xs"

      function App() {
        const [activeTab, setActiveTab] = useState('pos-menu');
        const [isInstallModalOpen, setIsInstallModalOpen] = useState(false);
        const [products, setProducts] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_products');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return INITIAL_PRODUCTS;
        });

        const [cart, setCart] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_cart');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return { 'item-1': 2, 'item-2': 1, 'item-5': 1 };
        });

        const [orders, setOrders] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_orders');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return INITIAL_DEMO_ORDERS;
        });

        const [profile, setProfile] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_profile');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return INITIAL_STORE_PROFILE;
        });

        const [cashiers, setCashiers] = useState(() => {
          try {
            const saved = localStorage.getItem('lao_pos_cashiers');
            if (saved) return JSON.parse(saved);
          } catch (e) {}
          return INITIAL_CASHIERS;
        });
        const [isCashierManagementOpen, setIsCashierManagementOpen] = useState(false);

        const [toasts, setToasts] = useState([]);
        const [isGpsModalOpen, setIsGpsModalOpen] = useState(false);
        const [isStoreSettingsOpen, setIsStoreSettingsOpen] = useState(false);
        const [isPermissionModalOpen, setIsPermissionModalOpen] = useState(false);
        const [isGoogleSheetModalOpen, setIsGoogleSheetModalOpen] = useState(false);
        const [permState, setPermState] = useState('prompt');

        useEffect(() => {
          checkGeoPermission().then((st) => setPermState(st));
          // ດຶງລາຍການເມນູຫຼ້າສຸດຈາກ Google Sheet & Drive ອັດຕະໂນມັດ ເມື່ອເປີດແອັບ
          fetchProductsFromGoogleSheet().then((sheetProducts) => {
            if (sheetProducts && Array.isArray(sheetProducts) && sheetProducts.length > 0) {
              setProducts(sheetProducts);
            }
          });
          // ດຶງລາຍຊື່ພະນັກງານ ແລະ ຮູບພາບຫຼ້າສຸດຈາກ Google Sheet & Drive ອັດຕະໂນມັດ
          fetchCashiersFromGoogleSheet().then((sheetCashiers) => {
            if (sheetCashiers && Array.isArray(sheetCashiers) && sheetCashiers.length > 0) {
              setCashiers(sheetCashiers);
            }
          });
        }, []);

        const triggerBrowserPermissionPrompt = async () => {
          return new Promise((resolve) => {
            if (!navigator.geolocation) {
              showToast('ບຣາວເຊີນີ້ບໍ່ຮອງຮັບ Geolocation', 'warning');
              resolve(false);
              return;
            }
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                const lat = Number(pos.coords.latitude.toFixed(6));
                const lng = Number(pos.coords.longitude.toFixed(6));
                const acc = Math.round(pos.coords.accuracy || 10);
                setPermState('granted');
                handleUpdateProfile({ lat, lng, gpsAccuracy: acc });
                showToast(`ອະນຸຍາດ GPS ສຳເລັດ! (±${acc}m)`, 'success');
                setIsPermissionModalOpen(false);
                resolve(true);
              },
              (err) => {
                if (err.code === err.PERMISSION_DENIED) {
                  setPermState('denied');
                  showToast('ສິດ GPS ຖືກປະຕິເສດ ກະລຸນາເປີດໃນການຕັ້ງຄ່າບຣາວເຊີ', 'warning');
                } else {
                  showToast('ບໍ່ສາມາດດຶງ GPS ໄດ້ໃນຕອນນີ້', 'error');
                }
                resolve(false);
              },
              { enableHighAccuracy: true, timeout: 8000 }
            );
          });
        };

        useEffect(() => {
          try { localStorage.setItem('lao_pos_products', JSON.stringify(products)); } catch (e) {}
        }, [products]);

        useEffect(() => {
          try { localStorage.setItem('lao_pos_cart', JSON.stringify(cart)); } catch (e) {}
        }, [cart]);

        useEffect(() => {
          try { localStorage.setItem('lao_pos_orders', JSON.stringify(orders)); } catch (e) {}
        }, [orders]);

        useEffect(() => {
          try { localStorage.setItem('lao_pos_profile', JSON.stringify(profile)); } catch (e) {}
        }, [profile]);

        useEffect(() => {
          try { localStorage.setItem('lao_pos_cashiers', JSON.stringify(cashiers)); } catch (e) {}
        }, [cashiers]);

        const showToast = (message, type = 'info') => {
          const id = `${Date.now()}-${Math.random()}`;
          setToasts((prev) => [...prev, { id, message, type }]);
          setTimeout(() => {
            setToasts((prev) => prev.filter((t) => t.id !== id));
          }, 3500);
        };

        const dismissToast = (id) => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        };

        const handleUpdateQty = (productId, delta) => {
          setCart((prev) => {
            const current = prev[productId] || 0;
            const next = current + delta;
            if (next <= 0) {
              const copy = { ...prev };
              delete copy[productId];
              return copy;
            }
            return { ...prev, [productId]: next };
          });
        };

        const handleSetQty = (productId, quantity) => {
          setCart((prev) => {
            if (quantity <= 0) {
              const copy = { ...prev };
              delete copy[productId];
              return copy;
            }
            return { ...prev, [productId]: Math.min(999, quantity) };
          });
        };

        const handleClearCart = () => {
          setCart({});
        };

        const handleUpdateProfile = (updated) => {
          setProfile((prev) => ({ ...prev, ...updated }));
        };

        const handleOrderCompleted = (newOrder) => {
          setOrders((prev) => [{ ...newOrder, syncedToSheet: true }, ...prev]);
          syncOrderToGoogleSheet(newOrder).then((res) => {
            if (res.success) {
              showToast(`ບັນທຶກລົງ Google Sheet ສຳເລັດ!`, 'success');
            }
          });
        };

        const handleToggleOrderStatus = (orderId, updates = {}) => {
          setOrders((prev) =>
            prev.map((order) => {
              if (order.id === orderId) {
                const nextStatus = updates.status !== undefined
                  ? updates.status
                  : order.status === 'delivered' ? 'pending' : 'delivered';
                const updatedOrder = {
                  ...order,
                  ...updates,
                  status: nextStatus,
                };
                updateStatusOnGoogleSheet(orderId, nextStatus, null, updatedOrder);
                return updatedOrder;
              }
              return order;
            })
          );
        };

        const handleAddProduct = async (newProduct) => {
          let updatedList;
          setProducts((prev) => {
            updatedList = [newProduct, ...prev.filter((p) => p.id !== newProduct.id)];
            return updatedList;
          });
          await saveSingleProductToGoogleSheet(newProduct);
          if (updatedList) {
            syncProductsToGoogleSheet(updatedList);
          }
        };

        const handleUpdateProduct = async (updatedProduct) => {
          let updatedList;
          setProducts((prev) => {
            updatedList = prev.map((p) => (p.id === updatedProduct.id ? updatedProduct : p));
            return updatedList;
          });
          await saveSingleProductToGoogleSheet(updatedProduct);
          if (updatedList) {
            syncProductsToGoogleSheet(updatedList);
          }
        };

        const handleDeleteProduct = (productId) => {
          setProducts((prev) => {
            const next = prev.filter((p) => p.id !== productId);
            syncProductsToGoogleSheet(next);
            return next;
          });
          setCart((prev) => {
            if (prev[productId]) {
              const copy = { ...prev };
              delete copy[productId];
              return copy;
            }
            return prev;
          });
        };

        const handleResetProducts = () => {
          setProducts(INITIAL_PRODUCTS);
          syncProductsToGoogleSheet(INITIAL_PRODUCTS);
        };

        const handleQuickSyncAll = async () => {
          vibrateSoft(20);
          showToast(`ກຳລັງຊິ້ງຂໍ້ມູນທັງໝົດກັບ Google Sheet ID: ${TARGET_SHEET_ID.slice(0, 10)}...`, 'info');
          try {
            for (const o of orders) {
              await syncOrderToGoogleSheet(o);
            }
            await syncCashiersToGoogleSheet(cashiers);
            await syncProductsToGoogleSheet(products);
            showToast('ຊິ້ງຂໍ້ມູນທັງໝົດ (ອໍເດີ, ພະນັກງານ, ເມນູ) ລົງ Google Sheet ຮຽບຮ້ອຍ! 📊', 'success');
          } catch (e) {
            showToast('ເກີດຂໍ້ຜິດພາດໃນການຊິ້ງຂໍ້ມູນ', 'error');
          }
        };

        const cartTotalCount = Object.values(cart).reduce((sum, q) => sum + q, 0);

        return (
          <div className="min-h-screen bg-[#faf8ff] text-[#131b2e] flex flex-col antialiased">
            <Toast toasts={toasts} onDismiss={dismissToast} />

            <GoogleSheetModal
              isOpen={isGoogleSheetModalOpen}
              onClose={() => setIsGoogleSheetModalOpen(false)}
              onShowToast={showToast}
              onSyncAll={handleQuickSyncAll}
            />

            <PermissionGuideModal
              isOpen={isPermissionModalOpen}
              onClose={() => setIsPermissionModalOpen(false)}
              permState={permState}
              onRequestPermission={triggerBrowserPermissionPrompt}
            />

            <GpsModal
              isOpen={isGpsModalOpen}
              onClose={() => setIsGpsModalOpen(false)}
              currentLat={profile.lat}
              currentLng={profile.lng}
              permState={permState}
              onOpenPermissionModal={() => { setIsGpsModalOpen(false); setIsPermissionModalOpen(true); }}
              onUpdateLocation={(lat, lng, acc) => handleUpdateProfile({ lat, lng, ...(acc ? { gpsAccuracy: acc } : {}) })}
              onShowToast={showToast}
            />

            <StoreSettingsModal
              isOpen={isStoreSettingsOpen}
              onClose={() => setIsStoreSettingsOpen(false)}
              profile={profile}
              cashiers={cashiers}
              onOpenCashierManagement={() => setIsCashierManagementOpen(true)}
              onUpdateProfile={handleUpdateProfile}
              onShowToast={showToast}
            />

            <CashierManagementModal
              isOpen={isCashierManagementOpen}
              onClose={() => setIsCashierManagementOpen(false)}
              cashiers={cashiers}
              onUpdateCashiers={setCashiers}
              onShowToast={showToast}
            />

            <DesktopInstallModal
              isOpen={isInstallModalOpen}
              onClose={() => setIsInstallModalOpen(false)}
              profile={profile}
            />

            <Header
              activeTab={activeTab}
              profile={profile}
              onEditStore={() => { vibrateSoft(); setIsStoreSettingsOpen(true); }}
              onOpenGpsModal={() => setIsGpsModalOpen(true)}
              onOpenGoogleSheetModal={() => { vibrateSoft(); setIsGoogleSheetModalOpen(true); }}
              onOpenInstallModal={() => { vibrateSoft(); setIsInstallModalOpen(true); }}
              onQuickSync={handleQuickSyncAll}
            />

            <main className="flex-1 w-full pt-16">
              {activeTab === 'pos-menu' && (
                <MenuTab
                  products={products}
                  cart={cart}
                  onUpdateQty={handleUpdateQty}
                  onSetQty={handleSetQty}
                  onGoToCart={() => { vibrateSoft(); setActiveTab('cart-and-whatsapp'); }}
                />
              )}
              {activeTab === 'cart-and-whatsapp' && (
                <CartTab
                  products={products}
                  cart={cart}
                  onUpdateQty={handleUpdateQty}
                  onSetQty={handleSetQty}
                  onClearCart={handleClearCart}
                  profile={profile}
                  onUpdateProfile={handleUpdateProfile}
                  onOrderCompleted={handleOrderCompleted}
                  onShowToast={showToast}
                  onGoToMenu={() => { vibrateSoft(); setActiveTab('pos-menu'); }}
                  onOpenPermissionModal={() => setIsPermissionModalOpen(true)}
                />
              )}
              {activeTab === 'sales-dashboard' && (
                <DashboardTab orders={orders} products={products} />
              )}
              {activeTab === 'order-history' && (
                <OrdersTab
                  orders={orders}
                  onDeleteOrder={(id) => setOrders((prev) => prev.filter((o) => o.id !== id))}
                  onClearAllOrders={() => setOrders([])}
                  onToggleOrderStatus={handleToggleOrderStatus}
                  profile={profile}
                  cashiers={cashiers}
                  onUpdateCashiers={setCashiers}
                  onShowToast={showToast}
                />
              )}
              {activeTab === 'catalog-settings' && (
                <CatalogTab
                  products={products}
                  profile={profile}
                  onOpenStoreSettings={() => { vibrateSoft(); setIsStoreSettingsOpen(true); }}
                  onAddProduct={handleAddProduct}
                  onUpdateProduct={handleUpdateProduct}
                  onDeleteProduct={handleDeleteProduct}
                  onResetProducts={handleResetProducts}
                  onShowToast={showToast}
                />
              )}
            </main>

            <BottomNav activeTab={activeTab} onChangeTab={setActiveTab} cartTotalCount={cartTotalCount} />
          </div>
        );
      }

      function startApp() {
        let root = document.getElementById('root');
        if (!root) {
          root = document.createElement('div');
          root.id = 'root';
          document.body.appendChild(root);
        }
        ReactDOM.createRoot(root).render(<App />);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }
    </script>
  </body>
</html>
